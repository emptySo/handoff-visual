function viewRecord(core, ui) {
  const isInitiator = ui.currentHolderId === core.handover.initiatorId;
  const rows = recordFor(core, ui.currentHolderId);
  const body = [];

  if (isInitiator) body.push(viewComposer(core, ui));

  if (rows.length === 0 && !isInitiator) {
    body.push(`<p class="muted" data-empty-record>${escapeHtml(VIEW_TEXT.noRecord)}</p>`);
  } else {
    for (const req of rows) body.push(viewRequirement(core, ui, req));
  }

  // 边界说明只给发起者看：助手只在他的书写位置上活动。
  if (isInitiator) body.push(viewBoundary());

  return `<section class="panel" data-panel="record"><h2>${escapeHtml(VIEW_TEXT.recordHeading)}</h2>${body.join("")}</section>`;
}

// —— 视图层的纯决策 ——
//
// 事件处理器里"该复用哪条要求""该不该落 action"这类判断不依赖 DOM 渲染，
// 只依赖平凡的输入值，因此抽成纯函数，可以在 Node 里直接断言。
// 独立评审指出：C1、I5 这两类问题本可被测试挡住——这一层就是为此存在的。

// 换身份后的界面状态。发起者"正在写的句子"跨身份保留：
// 演示时换人只能靠身份按钮，切过去再切回来不该丢掉书写进度（v2 L96 的建议挂在发起者书写位置）。
function planSwitchHolder(core, ui, holderId) {
  const card = cardOfHolder(core, holderId);
  return Object.assign({}, ui, {
    currentHolderId: holderId,
    selectedCardId: card ? card.id : null,
    panel: null,
  });
}

// 该接收人有没有一条"还能被发起者接着写"的要求？待回应、待重写都算；
// 已共识的不算——v2 L118 规定已共识的条不能由发起者主动改写（T11）。
function reusableRequirementId(core, initiatorId, receiverId) {
  const candidates = recordFor(core, initiatorId).filter((r) => r.receiverId === receiverId && !isCurrentAgreed(core, r));
  return candidates.length ? candidates[candidates.length - 1].id : null;
}

// 选中接收人之后该做什么。刻意**不**在这里新建要求：
// 否则为了看一眼下拉选项而点一下，就会在接收人侧留下一条没有内容的「给 X」，
// 直接推翻 v2「其他持卡人的对接记录中没有这一条」。要求实例推迟到第一次输入时才建。
function planComposerReceiver(core, ui, receiverId) {
  if (!receiverId) {
    return { ui: Object.assign({}, ui, { composerReceiverId: null, composingReqId: null }), actions: [] };
  }
  return {
    ui: Object.assign({}, ui, {
      composerReceiverId: receiverId,
      composingReqId: reusableRequirementId(core, ui.currentHolderId, receiverId),
    }),
    actions: [],
  };
}

// 指针交互的提交阈值（像素）。低于它视为"点了一下"，不落 any action。
const DRAG_THRESHOLD = 3;

// 抬手时判断这次交互要不要落 action。
// 零位移的点击必须不落：否则"只打开卡、不改画布，状态保持不变"（v2 L27）在演示中是假的，
// 而且会把走查里"音乐的卡不在编辑中，新块立即出现在可见版本上"那一幕毁掉。
function planPointerCommit(drag, endPoint) {
  if (!drag) return null;
  if (drag.mode === "ink") return drag.points.length > 1 ? { kind: "ink" } : null;
  const moved =
    Math.abs(endPoint.clientX - drag.startX) > DRAG_THRESHOLD || Math.abs(endPoint.clientY - drag.startY) > DRAG_THRESHOLD;
  return moved ? { kind: drag.mode } : null;
}

// —— 点击路由（纯函数）——
//
// 事件处理器只做两件事：把 DOM 读成一份载荷、把返回的下一步应用上去。
// 路由本身放在这里，是因为它必须能被断言——曾经"发放"按钮的守卫写成
// `if (!runtime.core) return`，而发放阶段 core 本来就是 null，
// 于是整个发放表单点了没反应，而当时 92 条断言全绿：渲染函数测过了，接线没测。

// 没有交接时也能用的入口。其余动作在没有交接时一律安静挡掉。
// toggle-console 必须在这里：发放表单阶段正是最需要「载入演示剧本」的时候。
const SETUP_ACTIONS = ["issue-handover", "reset-demo", "load-demo-script", "toggle-console"];
const actionUsableWithoutHandover = (action) => SETUP_ACTIONS.includes(action);

function planIssueHandover(form) {
  const thing = String((form && form.thing) || "").trim();
  if (!thing) return { ok: false, error: "EMPTY_THING" };
  return {
    ok: true,
    core: createCore({
      level: form.level,
      thing,
      initiatorName: form.initiatorName,
      participantNames: (form.participantNames || []).filter((n) => n !== form.initiatorName),
    }),
  };
}

// 发放表单的字段回填。没有交接时也必须工作，否则「东西」永远填不进去、发放永远失败。
function applySetupInput(form, bind, value) {
  if (bind === "thing") return Object.assign({}, form, { thing: value });
  return form;
}

function applySetupChange(form, bind, value, checked) {
  if (bind === "level") return Object.assign({}, form, { level: value });
  if (bind === "initiator") return Object.assign({}, form, { initiatorName: value });
  if (bind === "participant") {
    let names = form.participantNames;
    if (checked) names = names.includes(value) ? names : names.concat(value);
    else names = names.filter((n) => n !== value);
    return Object.assign({}, form, { participantNames: names });
  }
  return form;
}

// 把一组 action 依次 dispatch 到当前核心状态上；任一失败便记下错误码。
function runActions(core, actions) {
  let next = core;
  let error = null;
  for (const action of actions) {
    const result = dispatch(next, action);
    if (result.ok) next = result.core;
    else error = result.error;
  }
  return { core: next, error };
}

// 点击路由。返回 { core, ui, form, notice, resetStorage, consoleOpen }。
//
// 放置类动作（回车 / 「放上画布」）的默认落点：从上往下依次排开，
// 这样连放几句不会全叠在同一个点上（看起来像"没反应"）。
function defaultSpot(core, cardId, layer) {
  const card = core && core.cards ? core.cards[cardId] : null;
  const content = card ? card.draft || card.visible : null;
  const count = content && Array.isArray(content[layer]) ? content[layer].length : 0;
  const step = 34;
  const maxY = (CARD && CARD.h ? CARD.h : 480) - 70;
  return { x: 28, y: Math.min(28 + count * step, maxY) };
}

function planClick(core, ui, click) {
  const base = {
    core,
    ui,
    form: click.form,
    notice: "",
    resetStorage: false,
    consoleOpen: !!click.consoleOpen,
  };
  const action = click.action;

  if (!core && !actionUsableWithoutHandover(action)) return base;

  const apply = (actions, successText) => {
    const out = runActions(core, actions);
    return Object.assign({}, base, {
      core: out.core,
      notice: out.error ? errorText(out.error) : successText || "",
    });
  };

  switch (action) {
    case "toggle-console":
      return Object.assign({}, base, { consoleOpen: !click.consoleOpen });
    case "issue-handover": {
      const planned = planIssueHandover(click.form);
      if (!planned.ok) return Object.assign({}, base, { notice: VIEW_TEXT.needThing });
      return Object.assign({}, base, { core: planned.core, ui: createUi(planned.core), form: null });
    }
    case "load-demo-script": {
      const next = createDemoWorld();
      return Object.assign({}, base, { core: next, ui: createUi(next), form: null, consoleOpen: false });
    }
    case "reset-demo":
      return Object.assign({}, base, { core: null, ui: null, form: defaultSetupForm(), resetStorage: true, consoleOpen: false });

    case "switch-holder":
      // 换完身份就收起控制台：真实场景里你是换到了另一台设备上，不是留在一个悬浮面板里。
      return Object.assign({}, base, { ui: planSwitchHolder(core, ui, click.holderId), consoleOpen: false });
    case "select-card":
      return Object.assign({}, base, { ui: Object.assign({}, ui, { selectedCardId: click.cardId }) });
    case "set-tool":
      return Object.assign({}, base, { ui: Object.assign({}, ui, { tool: click.tool }) });

    case "submit-requirement":
      return apply([
        { type: ACTIONS.REQUIREMENT_SUBMIT, actorId: ui.currentHolderId, reqId: ui.composingReqId, attachmentLink: click.attachmentLink || null },
      ], VIEW_TEXT.submitted);
    case "adopt-suggestion":
      return apply([
        {
          type: ACTIONS.REQUIREMENT_ADOPT_SUGGESTION,
          actorId: ui.currentHolderId,
          reqId: click.reqId || ui.composingReqId,
        },
      ], VIEW_TEXT.suggestionAdopted);
    case "accept":
      return apply([{ type: ACTIONS.SUBMISSION_ACCEPT, actorId: ui.currentHolderId, reqId: click.reqId }], VIEW_TEXT.accepted);
    case "reject":
      return apply([{ type: ACTIONS.SUBMISSION_REJECT, actorId: ui.currentHolderId, reqId: click.reqId, note: click.note }], VIEW_TEXT.rejected);
    case "comment":
      return apply([{ type: ACTIONS.SUBMISSION_COMMENT, actorId: ui.currentHolderId, reqId: click.reqId, text: click.comment }], VIEW_TEXT.commented);
    case "upload":
      return apply([{ type: ACTIONS.CANVAS_UPLOAD, actorId: ui.currentHolderId, cardId: click.cardId }], VIEW_TEXT.uploaded);

    // 画歪一笔没救是硬伤，所以给两条退路：撤回上一步 / 清空涂层。
    // 「撤回上一步」跨图层：涂画、文字、链接按操作顺序一起撤。
    case "undo-step": {
      const card = core.cards[click.cardId];
      const content = card ? card.draft || card.visible : null;
      const total = content ? content.ink.length + content.texts.length + content.links.length : 0;
      if (total === 0) return Object.assign({}, base, { notice: VIEW_TEXT.nothingToUndo });
      return apply([{ type: ACTIONS.CANVAS_UNDO, actorId: ui.currentHolderId, cardId: click.cardId }], VIEW_TEXT.undoSomething);
    }
    case "undo-ink":
    case "clear-ink": {
      const card = core.cards[click.cardId];
      const content = card ? card.draft || card.visible : null;
      if (!content || content.ink.length === 0) return Object.assign({}, base, { notice: VIEW_TEXT.noInk });
      return action === "undo-ink"
        ? apply([{ type: ACTIONS.CANVAS_REMOVE_INK, actorId: ui.currentHolderId, cardId: click.cardId }], VIEW_TEXT.inkUndone)
        : apply([{ type: ACTIONS.CANVAS_REMOVE_INK, actorId: ui.currentHolderId, cardId: click.cardId, all: true }], VIEW_TEXT.inkCleared);
    }
    case "exit-edit":
      return apply([{ type: ACTIONS.CANVAS_EXIT_EDIT, actorId: ui.currentHolderId, cardId: click.cardId }], VIEW_TEXT.exitedEdit);

    // 回车 / 「放上画布」按钮走这里：落点自动排开，不需要用户先去点画布。
    case "place-text": {
      const text = String(click.text == null ? "" : click.text).trim();
      if (!text) return Object.assign({}, base, { notice: VIEW_TEXT.needTextFirst });
      return apply(
        [{ type: ACTIONS.CANVAS_ADD_TEXT, actorId: ui.currentHolderId, cardId: ui.selectedCardId, ...defaultSpot(core, ui.selectedCardId, "texts"), text }],
        VIEW_TEXT.textPlaced
      );
    }
    case "place-link": {
      // 按钮来的是 placeRef（下拉框的值），画布落点来的是 ref；两个都认
      const ref = String(click.placeRef || click.ref || "");
      if (!ref) return Object.assign({}, base, { notice: VIEW_TEXT.needLinkFirst });
      const found = PROJECT_OBJECTS.find((o) => o.ref === ref);
      return apply(
        [{
          type: ACTIONS.CANVAS_ADD_OWN_LINK,
          actorId: ui.currentHolderId,
          cardId: ui.selectedCardId,
          ...defaultSpot(core, ui.selectedCardId, "links"),
          label: found ? found.label : ref,
          targetRef: ref,
        }],
        VIEW_TEXT.linkPlaced
      );
    }
    case "remove-own-text":
      return apply([{ type: ACTIONS.CANVAS_REMOVE_TEXT, actorId: ui.currentHolderId, cardId: ui.selectedCardId, textId: click.textId }]);
    case "remove-own-link":
      return apply([{ type: ACTIONS.CANVAS_REMOVE_OWN_LINK, actorId: ui.currentHolderId, cardId: ui.selectedCardId, linkId: click.linkId }]);

    case "open-link":
      return Object.assign({}, base, { ui: Object.assign({}, ui, { panel: "project", projectRef: click.ref }) });
    case "close-panel":
      return Object.assign({}, base, { ui: Object.assign({}, ui, { panel: null }) });
    case "toggle-chat":
      return Object.assign({}, base, { ui: Object.assign({}, ui, { panel: ui.panel === "chat" ? null : "chat" }) });
    case "send-chat":
      return apply([{ type: ACTIONS.CHAT_SEND, actorId: ui.currentHolderId, text: click.chatText }]);

    default:
      return base;
  }
}

// —— 持久化：把 storage 作为参数注入，便于在 Node 里用假 storage 测降级路径 ——

// 卡内容的形状校验：共识块那一层最容易在手工改坏 JSON 时缺字段。
function isCanvasContent(value) {
  return (
    !!value &&
    typeof value === "object" &&
    Array.isArray(value.ink) &&
    Array.isArray(value.texts) &&
    Array.isArray(value.links) &&
    Array.isArray(value.blockInstances)
  );
}

// 只校验顶层键是不够的：顶层齐全而内部缺字段的数据会一路走到渲染里抛异常，
// 结果是没有任何提示的白屏——正是 Review Focus 第 5 条要求不得发生的那种情况。
function isCoreShape(value) {
  if (!value || typeof value !== "object" || typeof value.seq !== "number") return false;

  const handover = value.handover;
  if (!handover || typeof handover !== "object") return false;
  if (typeof handover.level !== "string" || typeof handover.thing !== "string") return false;
  if (typeof handover.rejectCount !== "number" || !Number.isFinite(handover.rejectCount)) return false;
  if (!Array.isArray(handover.holderIds)) return false;
  if (!handover.chat || !Array.isArray(handover.chat.messages)) return false;
  if (!value.holders || typeof value.holders !== "object") return false;
  if (!value.cards || typeof value.cards !== "object") return false;
  if (!value.blocks || typeof value.blocks !== "object") return false;
  if (!Array.isArray(value.requirements)) return false;

  if (!value.holders[handover.initiatorId]) return false;
  for (const holderId of handover.holderIds) {
    const holder = value.holders[holderId];
    if (!holder || !value.cards[holder.cardId]) return false;
  }
  for (const card of Object.values(value.cards)) {
    if (!card || typeof card !== "object") return false;
    if (typeof card.uploadedOnce !== "boolean") return false;
    if (!isCanvasContent(card.visible)) return false;
    if (card.draft !== null && !isCanvasContent(card.draft)) return false;
  }
  return true;
}

function readStoredCore(storage) {
  if (!storage) return null;
  try {
    const raw = storage.getItem(STORAGE_KEY);
    if (!raw) return null;
    const parsed = JSON.parse(raw);
    return isCoreShape(parsed) ? parsed : null;
  } catch (err) {
    return null;
  }
}

function writeStoredCore(storage, core) {
  if (!storage) return false;
  try {
    storage.setItem(STORAGE_KEY, JSON.stringify(core));
    return true;
  } catch (err) {
    return false;
  }
}

// —— 画布渲染 ——
//
// 逐层遍历核心层导出的 LAYER_ORDER，而不是在这里再写一遍层序。
// 层序是"绘制层位于共识块之下"（I6）这条约束的单一事实来源。

function renderInkLayer(content) {
  const paths = content.ink
    .map((stroke) => {
      const d = stroke.points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" ");
      return `<path d="${d}" />`;
    })
    .join("");
  // 预置一条空的实时笔迹：绘制过程中只改它的 d，抬手时整页重绘会把它清掉。
  // 这样就不需要 createElementNS，整个文件里不出现任何 URL 字符串。
  return `<svg class="layer layer-ink" data-layer="ink" viewBox="0 0 ${CARD.w} ${CARD.h}" preserveAspectRatio="none">${paths}<path data-live-ink="" d="" /></svg>`;
}

function renderOwnLinksLayer(core, ui, content, isOwn) {
  const items = content.links
    .map(
      (link) => `<div class="item own-link" data-own-link="${link.id}" style="left:${link.x}px;top:${link.y}px">
        <span class="tag" data-own-link-tag>${escapeHtml(VIEW_TEXT.ownLinkTag)}</span>
        <button type="button" class="link" data-action="open-link" data-ref="${escapeHtml(link.targetRef)}">${escapeHtml(link.label)}</button>
        ${isOwn ? `<button type="button" class="remove" data-action="remove-own-link" data-link-id="${link.id}">×</button>` : ""}
      </div>`
    )
    .join("");
  return `<div class="layer" data-layer="ownLinks">${items}</div>`;
}

function renderOwnTextsLayer(content, isOwn) {
  const items = content.texts
    .map((text) => {
      const sized = text.w ? `width:${text.w}px;height:${text.h}px;font-size:${Math.max(12, Math.round(text.h * 0.42))}px;` : "";
      return `<div class="item own-text" data-own-text="${text.id}" style="left:${text.x}px;top:${text.y}px;${sized}">
        <span class="own-text-body">${escapeHtml(text.text)}</span>
        ${isOwn ? `<span class="handle" data-text-handle data-text-id="${text.id}"></span>` : ""}
      </div>`;
    })
    .join("");
  return `<div class="layer" data-layer="ownTexts">${items}</div>`;
}

function renderBlocksLayer(core, content, isOwn) {
  const items = content.blockInstances
    .map((instance) => {
      const block = blockOf(core, instance.blockId);
      const link = block.attachmentLink
        ? `<button type="button" class="link" data-action="open-link" data-ref="${escapeHtml(block.attachmentLink.targetRef)}">${escapeHtml(block.attachmentLink.label)}</button>`
        : "";
      const handle = isOwn ? `<span class="handle" data-block-handle data-block-id="${block.id}"></span>` : "";
      return `<div class="item block" data-block="${block.id}"${isOwn ? ' data-action="move-block"' : ""}
        style="left:${instance.x}px;top:${instance.y}px;width:${instance.w}px;height:${instance.h}px">
        <p class="block-sentence" data-block-sentence>${escapeHtml(block.rawSentence)}</p>
        <p class="tiny muted">${escapeHtml(block.level)} · ${escapeHtml(block.thing)} · <span data-round-label>${escapeHtml(blockRoundLabel(core, block.id) === "current" ? TEXT.roundCurrent : TEXT.roundPrevious)}</span></p>
        ${link}
        ${handle}
      </div>`;
    })
    .join("");
  return `<div class="layer" data-layer="blockInstances">${items}</div>`;
}

const LAYER_RENDERERS = {
  ink: (core, ui, content, isOwn) => renderInkLayer(content),
  ownLinks: (core, ui, content, isOwn) => renderOwnLinksLayer(core, ui, content, isOwn),
  ownTexts: (core, ui, content, isOwn) => renderOwnTextsLayer(content, isOwn),
  blockInstances: (core, ui, content, isOwn) => renderBlocksLayer(core, content, isOwn),
};

const layerIsEmpty = (content, name) => (content[name] || []).length === 0;

function viewTools(card, ui) {
  const tool = (name, label) =>
    `<button type="button" class="tool-btn" data-action="set-tool" data-tool="${name}"${ui.tool === name ? ' aria-pressed="true"' : ""}>${escapeHtml(label)}</button>`;

  // 选中工具后必须同时出现：输入控件 + **一个明确的放置按钮** + 一句怎么用的提示。
  // 原来只有"选工具 → 去点画布"这一条路，没有任何提示，用户根本不知道要那样做。
  const textInput =
    ui.tool === "text"
      ? `<input type="text" data-bind="new-text" placeholder="${escapeHtml(VIEW_TEXT.textPlaceholder)}">
         <button type="button" class="place-btn" data-action="place-text">${escapeHtml(VIEW_TEXT.placeButton)}</button>
         <span class="tiny muted" data-place-hint>${escapeHtml(VIEW_TEXT.placeTextHint)}</span>`
      : "";
  const linkInput =
    ui.tool === "link"
      ? `<select data-bind="new-link">${PROJECT_OBJECTS.map((o) => `<option value="${escapeHtml(o.ref)}">${escapeHtml(o.label)}</option>`).join("")}</select>
         <button type="button" class="place-btn" data-action="place-link">${escapeHtml(VIEW_TEXT.placeButton)}</button>
         <span class="tiny muted" data-place-hint>${escapeHtml(VIEW_TEXT.placeLinkHint)}</span>`
      : "";

  return `<div class="tools" data-tools>
    ${tool("ink", VIEW_TEXT.inkTool)}
    ${tool("text", VIEW_TEXT.addTextButton)}
    ${tool("link", VIEW_TEXT.addLinkButton)}
    ${textInput}
    ${linkInput}
    <button type="button" data-action="undo-step" data-card-id="${card.id}">${escapeHtml(VIEW_TEXT.undoStepButton)}</button>
    <button type="button" data-action="clear-ink" data-card-id="${card.id}">${escapeHtml(VIEW_TEXT.clearInkButton)}</button>
    <button type="button" data-action="upload" data-card-id="${card.id}">${escapeHtml(VIEW_TEXT.uploadButton)}</button>
    <button type="button" data-action="exit-edit" data-card-id="${card.id}">${escapeHtml(VIEW_TEXT.exitEditButton)}</button>
  </div>`;
}

function viewCanvas(core, ui) {
  const card = ui.selectedCardId ? core.cards[ui.selectedCardId] : null;
  const heading = `<h2>${escapeHtml(VIEW_TEXT.canvasHeading)}</h2>`;

  if (!card) {
    return `<section class="panel" data-panel="canvas">${heading}<p class="muted" data-empty-canvas>${escapeHtml(VIEW_TEXT.emptyCanvas)}</p></section>`;
  }

  const isOwn = card.holderId === ui.currentHolderId;
  const status = cardStatus(core, card.id);
  const content = visibleContentFor(core, card.id, ui.currentHolderId);
  const viewingEditingOther = !isOwn && status === "editing";

  const notices = [];
  if (!isOwn) notices.push(`<p class="notice" data-readonly>${escapeHtml(VIEW_TEXT.readOnly)}</p>`);
  if (viewingEditingOther) {
    notices.push(`<p class="notice" data-editing-notice>${escapeHtml(VIEW_TEXT.editingBadge)}</p>`);
    notices.push(`<p class="notice" data-pre-edit-notice>${escapeHtml(VIEW_TEXT.seeingPreEdit)}</p>`);
  }
  if (LAYER_ORDER.every((name) => layerIsEmpty(content, name))) {
    notices.push(`<p class="muted" data-empty-canvas>${escapeHtml(VIEW_TEXT.emptyCanvas)}</p>`);
  }

  const layers = LAYER_ORDER.map((name) => LAYER_RENDERERS[name](core, ui, content, isOwn)).join("");

  return `<section class="panel" data-panel="canvas">${heading}
    <header class="canvas-header">
      <span class="card-title" data-card-title>${escapeHtml(card.holder)} · ${escapeHtml(card.level)} · ${escapeHtml(card.thing)}</span>
      <span class="badge" data-canvas-status="${status}">${escapeHtml(statusText(status))}</span>
      <span class="reject-count">${escapeHtml(VIEW_TEXT.rejectCountLabel)} <b data-reject-count="${core.handover.rejectCount}">${core.handover.rejectCount}</b></span>
    </header>
    ${notices.join("")}
    <div class="card-face" data-card-face>${layers}</div>
    ${isOwn ? viewTools(card, ui) : ""}
  </section>`;
}

// —— 整页组合 ——
//
// 通知条紧跟在顶栏之后、三栏之前：它是"刚才那一步为什么不行"的唯一反馈，
// 排到页尾就会掉到折叠线以下——点了按钮屏幕上什么都没有，正是"点了没反应"。
function viewApp(core, ui, notice, consoleOpen) {
  const main = `<main class="app">${viewCards(core, ui)}${viewRecord(core, ui)}${viewCanvas(core, ui)}</main>`;
  return viewTopbar(core, ui) + viewNotice(notice) + main + viewChat(core, ui) + viewProject(core, ui) + viewConsole(core, ui, consoleOpen);
}

// 渲染的兜底：状态被外部改坏时给一句可读的提示，而不是留下一片空白。
function viewAppSafe(core, ui, notice, consoleOpen) {
  try {
    return viewApp(core, ui, notice, consoleOpen);
  } catch (err) {
    return `<p class="notice" data-render-error>${escapeHtml(VIEW_TEXT.renderFailed)}</p>`;
  }
}

// —— 发放表单 ——
//
// v2 的「发放」＝建立交接记录并为每名持卡人生成一张空画布卡，由核心层的 createCore 承担。
// 因此这里没有对应的 action：表单只负责收集字段并调用那条唯一的构造路径。

const SETUP_PEOPLE = ["策划", "美术", "音乐", "程序"];
const SETUP_LEVELS = ["第一关", "第二关", "第三关"];

function defaultSetupForm() {
  return { level: SETUP_LEVELS[0], thing: "", initiatorName: SETUP_PEOPLE[0], participantNames: ["音乐", "程序"] };
}

function viewSetup(form) {
  const f = form || defaultSetupForm();
  const levels = SETUP_LEVELS.map((l) => `<option value="${escapeHtml(l)}"${f.level === l ? " selected" : ""}>${escapeHtml(l)}</option>`).join("");
  const initiators = SETUP_PEOPLE.map((p) => `<option value="${escapeHtml(p)}"${f.initiatorName === p ? " selected" : ""}>${escapeHtml(p)}</option>`).join("");
  const people = SETUP_PEOPLE.map(
    (p) =>
      `<label class="check"><input type="checkbox" data-bind="participant" value="${escapeHtml(p)}"${f.participantNames.includes(p) ? " checked" : ""}>${escapeHtml(p)}</label>`
  ).join("");

  return `<section class="panel setup" data-panel="setup">
    <h2>${escapeHtml(VIEW_TEXT.setupHeading)}</h2>
    <label class="field"><span>${escapeHtml(VIEW_TEXT.levelLabel)}</span><select data-bind="level">${levels}</select></label>
    <label class="field"><span>${escapeHtml(VIEW_TEXT.thingLabel)}</span><input type="text" data-bind="thing" value="${escapeHtml(f.thing)}"></label>
    <label class="field"><span>${escapeHtml(VIEW_TEXT.initiatorLabel)}</span><select data-bind="initiator">${initiators}</select></label>
    <fieldset class="field"><legend>${escapeHtml(VIEW_TEXT.participantsLabel)}</legend><div class="checks">${people}</div></fieldset>
    <button type="button" data-action="issue-handover">${escapeHtml(VIEW_TEXT.issueButton)}</button>
  </section>`;
}

function viewNotice(text) {
  return text ? `<p class="notice" data-notice>${escapeHtml(text)}</p>` : "";
}

// —— 临时对话（角落图标，不占画布）——
//
// 门槛完全读核心层的 chatUnlocked：次数不足时即使界面被点开也不渲染对话面板（v2 L80）。

function viewChatPanel(core) {
  const messages = core.handover.chat.messages
    .map((m) => `<li class="chat-msg" data-chat-msg>${escapeHtml(core.holders[m.fromId].name)}：${escapeHtml(m.text)}</li>`)
    .join("");

  return `<section class="chat-panel" data-chat-panel>
    <header>
      <h2>${escapeHtml(VIEW_TEXT.chatHeading)}</h2>
      <button type="button" data-action="close-panel">${escapeHtml(VIEW_TEXT.closeButton)}</button>
    </header>
    <p class="tiny muted" data-chat-scope>${escapeHtml(VIEW_TEXT.chatScopeNotice)}</p>
    <ul class="chat-messages" data-chat-messages>${messages}</ul>
    <span class="inline">
      <textarea data-bind="chat-text" placeholder="${escapeHtml(VIEW_TEXT.chatPlaceholder)}"></textarea>
      <button type="button" data-action="send-chat">${escapeHtml(VIEW_TEXT.chatSend)}</button>
    </span>
  </section>`;
}

function viewChat(core, ui) {
  const emphasized = chatEmphasized(core);
  const open = ui.panel === "chat";
  const icon = `<button type="button" class="chat-icon${emphasized ? " is-emphasized" : ""}" data-action="toggle-chat" aria-pressed="${open}">${escapeHtml(VIEW_TEXT.signLabel)}</button>`;
  const notice = emphasized ? `<p class="tiny muted" data-chat-notice>${escapeHtml(TEXT.rejectGateUnlocked)}</p>` : "";
  const panel = open ? viewChatPanel(core) : "";

  return `<aside class="chat-dock" data-panel="chat-dock">${icon}${notice}${panel}</aside>`;
}

// —— 项目面板（打开链接）——
//
// 只负责"打开项目管理中的那个对象"：高亮目标并显式标注演示不写入真实磁盘、权限不变。

const PROJECT_GROUPS = ["关卡文件", "声音", "图", "修改历史"];

function viewProject(core, ui) {
  if (ui.panel !== "project") return "";

  const groups = PROJECT_GROUPS.map((group) => {
    const items = PROJECT_OBJECTS.filter((o) => o.ref.startsWith(group + "/"))
      .map(
        (o) =>
          `<li class="${o.ref === ui.projectRef ? "is-highlighted" : ""}" data-project-object="${escapeHtml(o.ref)}">${escapeHtml(o.label)}</li>`
      )
      .join("");
    return `<section class="project-group"><h3>${escapeHtml(group)}</h3><ul>${items}</ul></section>`;
  }).join("");

  return `<div class="overlay" data-panel="project">
    <section class="project-panel" data-project-panel>
      <header>
        <h2>${escapeHtml(VIEW_TEXT.projectHeading)}</h2>
        <button type="button" data-action="close-panel">${escapeHtml(VIEW_TEXT.closeButton)}</button>
      </header>
      <p class="tiny muted" data-project-notice>${escapeHtml(VIEW_TEXT.projectDiskNotice)}</p>
      ${groups}
    </section>
  </div>`;
}

// —— DOM 挂载与事件接线：整个文件里只有这一段依赖浏览器 ——

const runtime = { core: null, ui: null, form: null, root: null, storage: null, notice: "", consoleOpen: false, drag: null };

const currentForm = () => runtime.form || (runtime.form = defaultSetupForm());

function render() {
  if (!runtime.root) return;
  if (!runtime.core) {
    runtime.root.innerHTML =
      viewSetup(currentForm()) + viewNotice(runtime.notice) + viewConsole(null, null, runtime.consoleOpen);
    return;
  }
  runtime.root.innerHTML = viewAppSafe(runtime.core, runtime.ui, runtime.notice, runtime.consoleOpen);
}

// 把 planClick 的返回应用上去。点击与控制台按键共用这一条路径。
function applyPlan(plan) {
  runtime.core = plan.core;
  runtime.ui = plan.ui;
  runtime.form = plan.form;
  runtime.notice = plan.notice;
  runtime.consoleOpen = plan.consoleOpen;

  if (plan.resetStorage) {
    try {
      if (runtime.storage) runtime.storage.removeItem(STORAGE_KEY);
    } catch (err) {
      /* 存储不可用时本来就是内存态 */
    }
  }
  if (!runtime.core && !runtime.storage) runtime.notice = VIEW_TEXT.storageDisabled;

  if (runtime.core) persist();
  render();
}

function persist() {
  if (!writeStoredCore(runtime.storage, runtime.core) && runtime.storage) {
    runtime.notice = VIEW_TEXT.storageDisabled;
  }
}

function applyAction(action) {
  const result = dispatch(runtime.core, action);
  if (!result.ok) {
    // 观众看到的必须是能读懂的一句话，不是 ALREADY_AGREED 这种码。
    runtime.notice = errorText(result.error);
    render();
    return false;
  }
  runtime.core = result.core;
  runtime.notice = "";
  persist();
  render();
  return true;
}

const readValue = (selector) => {
  const el = runtime.root.querySelector(selector);
  return el ? el.value : "";
};

function currentAttachmentLink() {
  const ref = readValue('[data-bind="composer-link"]');
  if (!ref) return null;
  const found = PROJECT_OBJECTS.find((o) => o.ref === ref);
  return { label: found ? found.label : ref, targetRef: ref };
}

function blockInstanceOf(cardId, blockId) {
  const card = runtime.core.cards[cardId];
  if (!card) return null;
  const content = card.draft === null ? card.visible : card.draft;
  return content.blockInstances.find((i) => i.blockId === blockId) || null;
}

function drawingWorld(event) {
  const hit = event && event.target && event.target.closest ? event.target.closest(".card-world") : null;
  return hit || document.querySelector(".own-slot .flip-inner.is-front .card-world");
}
function localDelta(dx, dy, world) {
  if (!world) return { x: dx, y: dy };
  const rect = world.getBoundingClientRect();
  const sx = rect.width ? CARD.w / rect.width : 1;
  const sy = rect.height ? CARD.h / rect.height : 1;
  return { x: dx * sx, y: dy * sy };
}
function cardFacePoint(event, world) {
  const surface = world || drawingWorld(event);
  if (!surface) return null;
  const rect = surface.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  const x = ((event.clientX - rect.left) / rect.width) * CARD.w;
  const y = ((event.clientY - rect.top) / rect.height) * CARD.h;
  return {
    x: Math.round(Math.max(0, Math.min(CARD.w, x))),
    y: Math.round(Math.max(0, Math.min(CARD.h, y))),
  };
}
function faceScale() {
  const world = document.querySelector(".own-slot .flip-inner.is-front .card-world");
  if (!world) return { x: 1, y: 1 };
  const delta = localDelta(1, 1, world);
  return { x: delta.x, y: delta.y };
}

// 输入原句时只换批注，不重绘整页——整页重绘会丢输入焦点（旧原型踩过这个坑）。
function refreshSuggestion() {
  const ui = runtime.ui;
  const req = ui.composingReqId ? requirementOf(runtime.core, ui.composingReqId) : null;
  const suggestion = req ? suggestionFor(runtime.core, req.id, ui.currentHolderId) : null;

  const box = runtime.root.querySelector("[data-suggestion]");
  if (box) box.outerHTML = viewSuggestion(suggestion, req ? req.draftText : "", req ? req.id : "");

  const submit = runtime.root.querySelector('[data-action="submit-requirement"]');
  if (submit) submit.disabled = !(req && !isCurrentAgreed(runtime.core, req));
}

// 事件处理器只负责：把 DOM 读成载荷 → 交给 planClick → 应用返回的下一步。
// 这里刻意不写任何"这一步能不能做"的判断——那些判断全在 planClick 里，那才是能被测试的部分。
function onClick(event) {
  // 刚拖完的那一下不算点击：否则把链接从 A 拖到 B，会顺带打开项目面板
  if (runtime.suppressClick) {
    runtime.suppressClick = false;
    return;
  }
  const el = event.target.closest("[data-action]");
  if (!el) return;

  const reqId = el.dataset.reqId;
  applyPlan(
    planClick(runtime.core, runtime.ui, {
      action: el.dataset.action,
      holderId: el.dataset.holderId,
      cardId: el.dataset.cardId,
      reqId,
      textId: el.dataset.textId,
      linkId: el.dataset.linkId,
      ref: el.dataset.ref,
      tool: el.dataset.tool,
      // 放置类动作的载荷：文本工具取输入框，链接工具取下拉框
      text: readValue('[data-bind="new-text"]'),
      placeRef: readValue('[data-bind="new-link"]'),
      note: readValue(`[data-bind="reject-note"][data-req-id="${reqId}"]`),
      comment: readValue(`[data-bind="comment-text"][data-req-id="${reqId}"]`),
      chatText: readValue('[data-bind="chat-text"]'),
      attachmentLink: currentAttachmentLink(),
      form: currentForm(),
      consoleOpen: runtime.consoleOpen,
    })
  );
}

// ~ 调出演示控制台。用 event.code 而不是 event.key，
// 这样在需要按 Shift 才能打出 ~ 的键盘布局上同样能触发。
function onKeyDown(event) {
  const typing = event.target && (event.target.tagName === "INPUT" || event.target.tagName === "TEXTAREA");
  if (!typing && (event.key === "z" || event.key === "Z") && cocreate.on && runtime.view === "main" && !runtime.consoleOpen) {
    event.preventDefault();
    undoCocreate();
    return;
  }
  // 画布工具条里按回车 = 把文字/链接放上画布。
  // 之前只有"选工具 → 去点画布"这一条路，回车什么都不做，用户写了字以为丢了。
  if (event.key === "Enter" && runtime.core && runtime.ui) {
    const bind = event.target?.dataset?.bind;
    if (bind === "new-text" && !event.shiftKey) {
      event.preventDefault();
      applyPlan(
        planClick(runtime.core, runtime.ui, {
          action: "place-text",
          text: readValue('[data-bind="new-text"]'),
          form: currentForm(),
          consoleOpen: runtime.consoleOpen,
        })
      );
      return;
    }
    if (bind === "new-link") {
      event.preventDefault();
      applyPlan(
        planClick(runtime.core, runtime.ui, {
          action: "place-link",
          ref: readValue('[data-bind="new-link"]'),
          form: currentForm(),
          consoleOpen: runtime.consoleOpen,
        })
      );
      return;
    }
  }

  if (event.code === "Backquote" || event.key === "~" || event.key === "`") {
    event.preventDefault();
    applyPlan(
      planClick(runtime.core, runtime.ui, {
        action: "toggle-console",
        consoleOpen: runtime.consoleOpen,
        form: currentForm(),
      })
    );
    return;
  }
  if (event.key === "Escape" && runtime.consoleOpen) {
    applyPlan(
      planClick(runtime.core, runtime.ui, {
        action: "toggle-console",
        consoleOpen: runtime.consoleOpen,
        form: currentForm(),
      })
    );
  }
}

function onInput(event) {
  const el = event.target.closest("[data-bind]");
  if (!el) return;

  // 没有交接时（发放表单阶段）也要能回填字段，否则「东西」永远填不进去、发放永远失败。
  if (!runtime.core || !runtime.ui) {
    runtime.form = applySetupInput(currentForm(), el.dataset.bind, el.value);
    return;
  }

  if (el.dataset.bind === "composer-text") {
    const ui = runtime.ui;
    let reqId = ui.composingReqId;

    // 要求实例推迟到第一次输入时才建：只选接收人不该在记录里留下没有内容的条目。
    if (!reqId) {
      if (!ui.composerReceiverId) {
        runtime.notice = VIEW_TEXT.pickReceiverFirst;
        render();
        return;
      }
      const created = dispatch(runtime.core, {
        type: ACTIONS.REQUIREMENT_NEW,
        actorId: ui.currentHolderId,
        receiverId: ui.composerReceiverId,
      });
      if (!created.ok) {
        runtime.notice = errorText(created.error);
        render();
        return;
      }
      runtime.core = created.core;
      reqId = created.core.requirements[created.core.requirements.length - 1].id;
      ui.composingReqId = reqId;
    }

    const result = dispatch(runtime.core, {
      type: ACTIONS.REQUIREMENT_SET_DRAFT,
      actorId: ui.currentHolderId,
      reqId,
      text: el.value,
    });
    if (!result.ok) return;
    runtime.core = result.core;
    persist();
    refreshSuggestion();
    return;
  }
  if (el.dataset.bind === "thing") {
    runtime.form = applySetupInput(currentForm(), "thing", el.value);
  }
}

function onChange(event) {
  const el = event.target.closest("[data-bind]");
  if (!el) return;

  // 同样：发放表单阶段的勾选与下拉必须能回填。
  if (!runtime.core || !runtime.ui) {
    runtime.form = applySetupChange(currentForm(), el.dataset.bind, el.value, el.checked);
    return;
  }

  if (el.dataset.bind !== "composer-receiver") return;

  // 决策抽在 planComposerReceiver 里：它刻意不返回建条动作，
  // 所以"只点一下接收人"不会在记录里留下空白条目。
  const plan = planComposerReceiver(runtime.core, runtime.ui, el.value);
  runtime.ui = plan.ui;
  for (const action of plan.actions) {
    const result = dispatch(runtime.core, action);
    if (result.ok) runtime.core = result.core;
  }
  persist();
  render();
}

function onPointerDown(event) {
  if (!runtime.core || !runtime.ui) return;
  const ui = runtime.ui;

  // 文字 / 链接也要能拖。
  //
  // 难点：链接块的主体面积就是一个 <button>（点它打开项目面板），
  // 所以不能照旧一律 closest("button") 就返回——那样链接永远拖不动。
  // 也不能在上面 preventDefault（会连按钮的 click 一起废掉）。
  // 做法是**按位移阈值分流**：按下不动 → 交给按钮的 click；
  // 动了超过 4px → 变成拖动，并抑制随后的 click（见 onClick 的 suppressClick）。
  const textHandle = event.target.closest("[data-text-handle]");
  if (textHandle) {
    const chip = textHandle.closest("[data-own-text]");
    if (chip) {
      runtime.drag = {
        mode: "resizeText",
        textId: textHandle.dataset.textId,
        startX: event.clientX,
        startY: event.clientY,
        w: chip.offsetWidth,
        h: chip.offsetHeight,
        el: chip,
        world: chip.closest(".card-world"),
      };
      event.preventDefault();
    }
    return;
  }

  const chip = event.target.closest("[data-own-text], [data-own-link]");
  if (chip) {
    const isText = chip.hasAttribute("data-own-text");
    const base = {
      startX: event.clientX,
      startY: event.clientY,
      x: parseFloat(chip.style.left) || 0,
      y: parseFloat(chip.style.top) || 0,
      moved: false,
      el: chip,
      world: chip.closest(".card-world"),
    };
    runtime.drag = isText
      ? Object.assign(base, { mode: "moveText", textId: chip.dataset.ownText })
      : Object.assign(base, { mode: "moveLink", linkId: chip.dataset.ownLink });
    if (isText) {
      event.preventDefault();
      chip.setPointerCapture(event.pointerId);
    }
    return;
  }

  // 点块里的链接或删除按钮时不要顺手开始拖拽。
  if (event.target.closest("button")) return;

  const handle = event.target.closest("[data-block-handle]");
  if (handle) {
    const inst = blockInstanceOf(ui.selectedCardId, handle.dataset.blockId);
    if (inst) runtime.drag = { mode: "resize", blockId: handle.dataset.blockId, startX: event.clientX, startY: event.clientY, w: inst.w, h: inst.h, world: handle.closest(".card-world") };
    event.preventDefault();
    return;
  }

  const movable = event.target.closest('[data-action="move-block"]');
  if (movable) {
    const inst = blockInstanceOf(ui.selectedCardId, movable.dataset.block);
    if (inst) runtime.drag = { mode: "move", blockId: movable.dataset.block, startX: event.clientX, startY: event.clientY, x: inst.x, y: inst.y, world: movable.closest(".card-world") };
    event.preventDefault();
    return;
  }

  if (!event.target.closest("[data-card-face]")) return;
  const world = drawingWorld(event);
  const point = cardFacePoint(event, world);
  if (!point) return;

  if (ui.tool === "ink") {
    runtime.drag = { mode: "ink", points: [point], world };
    event.preventDefault();
    return;
  }
  if (ui.tool === "text") {
    const text = readValue('[data-bind="new-text"]').trim();
    if (!text) {
      runtime.notice = VIEW_TEXT.needTextFirst;
      render();
      return;
    }
    applyAction({ type: ACTIONS.CANVAS_ADD_TEXT, actorId: ui.currentHolderId, cardId: ui.selectedCardId, x: point.x, y: point.y, text });
    // 同链接：放完一次就退出放置模式，避免后续误点又多落一句
    runtime.ui = Object.assign({}, ui, { tool: "select" });
    render();
    return;
  }
  if (ui.tool === "link") {
    const ref = readValue('[data-bind="new-link"]');
    if (!ref) {
      runtime.notice = VIEW_TEXT.needLinkFirst;
      render();
      return;
    }
    const found = PROJECT_OBJECTS.find((o) => o.ref === ref);
    applyAction({
      type: ACTIONS.CANVAS_ADD_OWN_LINK,
      actorId: ui.currentHolderId,
      cardId: ui.selectedCardId,
      x: point.x,
      y: point.y,
      label: found ? found.label : ref,
      targetRef: ref,
    });
    // 放完一次就退出放置模式：工具一直停在"链接"上时，
    // 之后每一笔点画布都会再落一个链接，误触极难发现。
    runtime.ui = Object.assign({}, ui, { tool: "select" });
    render();
  }
}

function onPointerMove(event) {
  const drag = runtime.drag;
  if (!drag) return;

  // 拖文字 / 拖链接：只改 DOM 位置（跟手），抬手时才落 action。
  // 这样拖动过程中不会每一帧都重渲染整页。
  if (drag.mode === "moveText" || drag.mode === "moveLink") {
    const dx = event.clientX - drag.startX;
    const dy = event.clientY - drag.startY;
    // 阈值：小于 4px 视为"按了一下"，不算拖动——否则点按钮会变成微移
    if (!drag.moved && Math.hypot(dx, dy) < 4) return;
    if (!drag.moved) {
      drag.moved = true;
      drag.el?.classList.add("is-dragging");
    }
    const el = drag.el;
    if (!el) return;
    const delta = localDelta(dx, dy, drag.world);
    el.style.left = Math.round(drag.x + delta.x) + "px";
    el.style.top = Math.round(drag.y + delta.y) + "px";
    return;
  }

  if (drag.mode === "resizeText") {
    const delta = localDelta(event.clientX - drag.startX, event.clientY - drag.startY, drag.world);
    const w = Math.max(24, Math.round(drag.w + delta.x));
    const h = Math.max(18, Math.round(drag.h + delta.y));
    drag.el.style.width = w + "px";
    drag.el.style.height = h + "px";
    drag.el.style.fontSize = Math.max(12, Math.round(h * 0.42)) + "px";
    drag.nextW = w;
    drag.nextH = h;
    return;
  }

  if (drag.mode === "ink") {
    const point = cardFacePoint(event, drag.world);
    if (!point) return;
    drag.points.push(point);
    const live = drag.world ? drag.world.querySelector("[data-live-ink]") : runtime.root.querySelector("[data-live-ink]");
    if (!live) return;
    live.setAttribute("d", drag.points.map((p, i) => `${i === 0 ? "M" : "L"} ${p.x} ${p.y}`).join(" "));
    return;
  }

  // 拖拽与缩放期间只改 DOM 样式，抬手时才 dispatch 一次（规格 §10 R3）。
  const el = runtime.root.querySelector(`[data-block="${drag.blockId}"]`);
  if (!el) return;
  const delta = localDelta(event.clientX - drag.startX, event.clientY - drag.startY, drag.world);

  if (drag.mode === "move") {
    el.style.left = Math.round(drag.x + delta.x) + "px";
    el.style.top = Math.round(drag.y + delta.y) + "px";
  } else {
    el.style.width = Math.max(24, Math.round(drag.w + delta.x)) + "px";
    el.style.height = Math.max(24, Math.round(drag.h + delta.y)) + "px";
  }
}

function onPointerUp(event) {
  const drag = runtime.drag;
  runtime.drag = null;
  if (!drag || !runtime.core || !runtime.ui) return;
  const ui = runtime.ui;

  if (drag.mode === "resizeText") {
    runtime.suppressClick = true;
    setTimeout(() => { runtime.suppressClick = false; }, 0);
    applyAction({
      type: ACTIONS.CANVAS_MOVE_TEXT,
      actorId: ui.currentHolderId,
      cardId: ui.selectedCardId,
      textId: drag.textId,
      x: parseFloat(drag.el.style.left) || 0,
      y: parseFloat(drag.el.style.top) || 0,
      w: drag.nextW,
      h: drag.nextH,
    });
    return;
  }

  // 拖文字 / 拖链接：抬手时落 action。
  if (drag.mode === "moveText" || drag.mode === "moveLink") {
    // 没超过阈值 = 只是按了一下，交给按钮自己的 click（打开链接 / 删除），不要吞掉
    if (!drag.moved) {
      drag.el?.classList.remove("is-dragging");
      return;
    }
    const el = drag.el;
    const pos = el ? { x: parseFloat(el.style.left), y: parseFloat(el.style.top) } : null;
    // 拖过之后紧接着的那次 click 要吞掉，否则"移动一下"会顺手把项目面板打开。
    // 但必须**自动过期**：如果拖动结束时鼠标已经停在别处，浏览器不会补发 click，
    // 这个标志就会一直挂着，把之后第一次真实点击吞掉（实测把"上传"的确认吃没了）。
    runtime.suppressClick = true;
    setTimeout(() => { runtime.suppressClick = false; }, 0);
    if (pos && Number.isFinite(pos.x) && Number.isFinite(pos.y)) {
      applyAction(
        drag.mode === "moveText"
          ? { type: ACTIONS.CANVAS_MOVE_TEXT, actorId: ui.currentHolderId, cardId: ui.selectedCardId, textId: drag.textId, x: pos.x, y: pos.y }
          : { type: ACTIONS.CANVAS_MOVE_OWN_LINK, actorId: ui.currentHolderId, cardId: ui.selectedCardId, linkId: drag.linkId, x: pos.x, y: pos.y }
      );
      return;
    }
    render();
    return;
  }

  // 零位移的点击不落 action：否则点一下共识块就会把卡改成"编辑中"，
  // 而 v2 L27 说的是"只打开卡、不改画布，状态保持不变"。
  const decision = planPointerCommit(drag, { clientX: event.clientX, clientY: event.clientY });
  if (!decision) {
    render();
    return;
  }

  if (decision.kind === "ink") {
    applyAction({ type: ACTIONS.CANVAS_ADD_INK, actorId: ui.currentHolderId, cardId: ui.selectedCardId, points: drag.points });
    return;
  }

  const el = runtime.root.querySelector(`[data-block="${drag.blockId}"]`);
  if (!el) {
    render();
    return;
  }
  if (decision.kind === "move") {
    applyAction({
      type: ACTIONS.CANVAS_MOVE_BLOCK,
      actorId: ui.currentHolderId,
      cardId: ui.selectedCardId,
      blockId: drag.blockId,
      x: parseFloat(el.style.left),
      y: parseFloat(el.style.top),
    });
  } else {
    applyAction({
      type: ACTIONS.CANVAS_RESIZE_BLOCK,
      actorId: ui.currentHolderId,
      cardId: ui.selectedCardId,
      blockId: drag.blockId,
      w: parseFloat(el.style.width),
      h: parseFloat(el.style.height),
    });
  }
}

function mount() {
  const root = document.getElementById("app");
  if (!root) return;
  runtime.root = root;

  try {
    runtime.storage = window.localStorage;
  } catch (err) {
    runtime.storage = null; // file:// 下策略可能禁用存储，降级为内存态
  }

  const restored = readStoredCore(runtime.storage);
  if (restored) {
    runtime.core = restored;
    runtime.ui = createUi(runtime.core);
  } else {
    runtime.core = null;
    runtime.notice = runtime.storage ? "" : VIEW_TEXT.storageDisabled;
  }

  root.addEventListener("click", onClick);
  root.addEventListener("input", onInput);
  root.addEventListener("change", onChange);
  root.addEventListener("pointerdown", onPointerDown);
  root.addEventListener("pointermove", onPointerMove);
  root.addEventListener("pointerup", onPointerUp);
  root.addEventListener("pointercancel", onPointerUp);
  // 挂在 document 上：~ 键不该依赖焦点落在哪里。
  document.addEventListener("keydown", onKeyDown);

  render();
}

function loadProject() {
  try {
    const saved = JSON.parse(localStorage.getItem(PROJECT_KEY));
    if (saved && saved.project && saved.ui) return saved;
  } catch (err) {}
  return {
    ui: { uploadName: "", uploadShelf: "声音", projectPath: "D:\\Game\\Prototype" },
    project: { path: "", bound: false, pending: [], files: [], levels: ["第一关", "第二关", "第三关"].map((name) => ({ name, note: "" })), log: [], taken: null }
  };
}
let projectState = loadProject();

function saveProject() {
  try { localStorage.setItem(PROJECT_KEY, JSON.stringify(projectState)); } catch (err) {}
}

function currentRole() {
  if (runtime.core && runtime.ui && runtime.core.holders[runtime.ui.currentHolderId]) {
    return runtime.core.holders[runtime.ui.currentHolderId].name;
  }
  return "策划";
}

function shelfForRole(role) {
  if (role === "音乐") return "声音";
  if (role === "美术") return "图";
  return "说明";
}
function defaultExt(role) {
  if (role === "音乐") return ".wav";
  if (role === "美术") return ".png";
  return ".txt";
}
function extOf(name, fallback) {
  const matched = String(name || "").match(/(\.[a-z0-9]{1,5})$/i);
  return matched ? matched[1].toLowerCase() : fallback;
}
function safeName(value) {
  return String(value || "").trim().replace(/[\\/:*?"<>|\s]/g, "") || "未命名";
}
function nowText() {
  const d = new Date();
  const p = (n) => String(n).padStart(2, "0");
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function placeGate() {
  if (!projectState.project.bound) return { ok: false, why: "还没有绑定项目文件夹。" };
  if (!runtime.core) return { ok: false, why: "还没有交接卡。" };
  return { ok: true, why: "" };
}
function bindProject() {
  const role = currentRole();
  if (role !== "策划" && role !== "程序") return;
  const path = projectState.ui.projectPath.trim().replace(/[\\/]+$/, "");
  if (!path) return;
  projectState.project.path = path;
  projectState.project.bound = true;
  saveProject();
  render();
}
function unbindProject() {
  const role = currentRole();
  if (role !== "策划" && role !== "程序") return;
  projectState.project.bound = false;
  projectState.project.path = "";
  saveProject();
  render();
}
function queueFile() {
  const role = currentRole();
  const original = projectState.ui.uploadName.trim();
  if (!original || !runtime.core) {
    projectState.project.log.push(nowText() + " 没能收下：" + (!runtime.core ? "还没有交接卡" : "没有文件名"));
    saveProject();
    render();
    return;
  }
  const shelf = projectState.ui.uploadShelf || shelfForRole(role);
  const ext = extOf(original, defaultExt(role));
  const level = runtime.core.handover.level;
  const thing = runtime.core.handover.thing;
  let file = level + "_" + role + "_" + safeName(thing) + ext;
  const used = new Set(projectState.project.files.concat(projectState.project.pending).map((item) => item.shelf + "/" + item.file));
  let n = 2;
  while (used.has(shelf + "/" + file)) {
    file = level + "_" + role + "_" + safeName(thing) + "_" + n + ext;
    n += 1;
  }
  projectState.project.pending.push({ id: String(Date.now()), fromRole: role, original, shelf, file });
  projectState.ui.uploadName = "";
  projectState.project.log.push(nowText() + " " + role + "交出原名「" + original + "」。助手拟名「" + file + "」，尚未写入。");
  saveProject();
  render();
}
function placeFile(id) {
  const gate = placeGate();
  if (!gate.ok) return;
  const index = projectState.project.pending.findIndex((item) => item.id === id);
  if (index < 0) return;
  const item = projectState.project.pending.splice(index, 1)[0];
  projectState.project.files.push(item);
  const level = projectState.project.levels.find((entry) => entry.name === runtime.core.handover.level);
  if (level) level.note = "已放入 " + item.file + "，原名 " + item.original;
  projectState.project.log.push(nowText() + " 协作助手写入 " + item.shelf + "\\" + item.file + "。当时界面身份是" + currentRole() + "，写入者不是这个人。");
  saveProject();
  render();
}
function takeFile(id) {
  const role = currentRole();
  if (role !== "策划" && role !== "程序") return;
  const item = projectState.project.files.find((entry) => entry.id === id);
  if (!item || !projectState.project.bound) return;
  projectState.project.taken = ["已取到" + role + "的电脑", "路径：" + projectState.project.path + "\\" + item.shelf + "\\" + item.file, "原文件名：" + item.original].join("\n");
  projectState.project.log.push(nowText() + " " + role + "取出 " + item.shelf + "\\" + item.file);
  saveProject();
  render();
}

function parkInspect() {
  document.querySelectorAll("body > .mini").forEach((node) => node.remove());
  const open = document.querySelector(".mini.is-open");
  const dim = document.getElementById("inspect-dim");
  if (open) document.body.appendChild(open);
  if (dim && !dim.hidden) document.body.appendChild(dim);
}
function openInspect(mini) {
  const token = {};
  mini._inspectToken = token;
  const dim = document.getElementById("inspect-dim");
  const first = mini.getBoundingClientRect();
  document.body.appendChild(dim);
  dim.hidden = false;
  document.body.appendChild(mini);
  mini.classList.add("is-open");
  scaleWorlds(mini);
  const last = mini.getBoundingClientRect();
  const dx = first.left + first.width / 2 - (last.left + last.width / 2);
  const dy = first.top + first.height / 2 - (last.top + last.height / 2);
  const scale = last.width ? first.width / last.width : 1;
  const motion = mini.animate([
    { transform: "translate(calc(-50% + " + dx + "px), calc(-50% + " + dy + "px)) scale(" + scale + ") rotate(0deg)" },
    { transform: "translate(-50%, -50%) scale(1) rotate(-8deg)", offset: 0.7 },
    { transform: "translate(-50%, -50%) scale(1) rotate(0deg)" }
  ], { duration: 780, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
  motion.finished.then(() => {
    if (mini._inspectToken !== token) return;
    const inner = mini.querySelector(".flip-inner");
    if (inner) inner.classList.add("is-front");
    scaleWorlds(mini);
  }).catch(() => {});
}
function closeInspect() {
  runtime.inspectId = null;
  const dim = document.getElementById("inspect-dim");
  if (dim) dim.hidden = true;
  document.querySelectorAll(".mini.is-open, .mini").forEach((node) => { node._inspectToken = null; });
  const home = document.querySelector(".other-tray");
  document.querySelectorAll(".mini.is-open").forEach((node) => {
    const inner = node.querySelector(".flip-inner");
    const first = node.getBoundingClientRect();
    node.classList.remove("is-open");
    if (inner) inner.classList.remove("is-front");
    if (home) home.appendChild(node);
    scaleWorlds(node);
    const last = node.getBoundingClientRect();
    const dx = first.left + first.width / 2 - (last.left + last.width / 2);
    const dy = first.top + first.height / 2 - (last.top + last.height / 2);
    const scale = last.width ? first.width / last.width : 1;
    node.animate([
      { transform: "translate(" + dx + "px, " + dy + "px) scale(" + scale + ")" },
      { transform: "none" }
    ], { duration: 720, easing: "cubic-bezier(0.22, 1, 0.36, 1)" });
  });
  if (runtime.core && runtime.ui) {
    const mine = cardOfHolder(runtime.core, runtime.ui.currentHolderId);
    if (mine) runtime.ui.selectedCardId = mine.id;
  }
}

function applyScene() {
  Object.keys(layoutStore.pieces).forEach((id) => {
    const el = document.querySelector('[data-piece="' + id + '"]');
    const spot = layoutStore.pieces[id];
    if (!el || !spot || el.classList.contains("is-open")) return;

    }

    el.style.position = "absolute";
    el.style.left = spot.x + unit;
    el.style.top = spot.y + unit;
    el.style.width = spot.w + unit;
    if (spot.h) el.style.height = spot.h + unit;
    el.style.zIndex = String(spot.z || 1);

function stampUi() {
  document.querySelectorAll("#stage button, #stage input, #stage textarea, #stage select, #stage h2, #stage h3, #stage img.grid, #stage .board, #stage .slip, #stage .note, #stage .pencil, #stage .ui-panel, #stage .own-slot, #stage .mini, #stage .field, #stage .box").forEach((el) => {
    if (el.closest("#console, .seam, .flip-hit, #cocreate-layer, #cocreate-toggle")) return;
    if (el.classList.contains("flip-hit")) return;
    if (!el.dataset.piece) {
      const panel = el.closest("[data-panel]");
      const bits = [panel ? panel.dataset.panel : "page", el.tagName.toLowerCase()];
      if (el.dataset.action) bits.push(el.dataset.action);
      if (el.dataset.bind) bits.push(el.dataset.bind);
      if (el.dataset.tool) bits.push(el.dataset.tool);
      if (el.dataset.reqId) bits.push(el.dataset.reqId);
      if (!el.dataset.action && !el.dataset.bind) {
        const text = (el.getAttribute("aria-label") || el.textContent || "").trim().replace(/\s+/g, "").slice(0, 8);
        if (text) bits.push(text);

      el.dataset.piece = bits.join("-");

    if (!layoutStore.pieces[el.dataset.piece]) {

        ? { x: 0, y: 0, w: 138, h: 176, r: 0, z: 4, unit: "px", scenic: false, tuned: false }
        : { x: 0, y: 0, w: 20, h: 8, r: 0, z: 2, unit: "%", scenic: false, tuned: false };

function markTuned(spot) {

}
function measureUntuned(el, spot) {
  if (!spot || spot.tuned || spot.scenic !== false) return;
  const parent = el.offsetParent || el.parentElement;
  if (!parent) return;
  const parentRect = parent.getBoundingClientRect();
  const rect = el.getBoundingClientRect();
  if (!parentRect.width || !parentRect.height) return;
  spot.x = Math.round((rect.left - parentRect.left) / parentRect.width * 1000) / 10;
  spot.y = Math.round((rect.top - parentRect.top) / parentRect.height * 1000) / 10;
  spot.w = Math.round(rect.width / parentRect.width * 1000) / 10;
  spot.h = Math.round(rect.height / parentRect.height * 1000) / 10;
  spot.unit = "%";
}

function tunerOptions() {

  const pool = kind === "seam" ? Object.values(layoutStore.buttons) : kind === "pack" ? layoutStore.pack : Object.values(layoutStore.pieces);
  if (!holder) return;
  if (kind === "piece") markTuned(holder);
  const ahead = pool.filter((other) => other !== holder && (dir > 0 ? other.z > holder.z : other.z < holder.z))

let frameDrag = null;
function grabsFrame(event, frame) {
  if (event.target.closest("button, input, textarea, select, a, label, summary")) return false;
  if (event.target.closest(".win-bar, .term-win header")) return true;
  const rect = frame.getBoundingClientRect();
  const x = event.clientX - rect.left;
  const y = event.clientY - rect.top;
  return x < 14 || y < 14 || rect.width - x < 14 || rect.height - y < 14;
}
document.addEventListener("pointerdown", (event) => {
  if (runtime.consoleOpen || event.button !== 0) return;
  const frame = event.target.closest(".win, .term-win");
  if (!frame || !frame.dataset.win || !grabsFrame(event, frame)) return;
  const parent = frame.offsetParent || frame.parentElement;
  const parentRect = parent.getBoundingClientRect();
  const rect = frame.getBoundingClientRect();
  winPos[frame.dataset.win] = {
    x: rect.left - parentRect.left,
    y: rect.top - parentRect.top,
    w: rect.width,
    h: rect.height
  };
  frame.style.position = "absolute";
  frame.style.margin = "0";
  frame.style.left = winPos[frame.dataset.win].x + "px";
  frame.style.top = winPos[frame.dataset.win].y + "px";
  frame.style.width = rect.width + "px";
  frame.style.height = rect.height + "px";
  frame.style.zIndex = "7";
  frameDrag = { id: frame.dataset.win, pointer: event.pointerId, dx: event.clientX - rect.left, dy: event.clientY - rect.top, parent };
  frame.setPointerCapture(event.pointerId);
  event.preventDefault();
}, true);
document.addEventListener("pointermove", (event) => {
  if (!frameDrag || event.pointerId !== frameDrag.pointer) return;
  const pos = winPos[frameDrag.id];
  const parentRect = frameDrag.parent.getBoundingClientRect();
  pos.x = event.clientX - frameDrag.dx - parentRect.left;
  pos.y = event.clientY - frameDrag.dy - parentRect.top;
  const frame = document.querySelector('[data-win="' + frameDrag.id + '"]');
  if (!frame) return;
  frame.style.left = pos.x + "px";
  frame.style.top = pos.y + "px";
});

  if (frameDrag && event.pointerId === frameDrag.pointer) frameDrag = null;
});

let tuneDrag = null;
document.addEventListener("pointerdown", (event) => {
  if (!runtime.consoleOpen || event.button !== 0) return;
  if (event.target.closest("#console")) return;
  const handle = event.target.closest("#xform [data-handle]");
  const piece = event.target.closest("[data-piece], .seam");
  const el = handle ? selectedTuneElement() : piece;
  if (!el) {
    const sel = document.getElementById("tuner-target");
    sel.value = "";
    fillTuner();
    placeFrame();
    return;
  }
  const id = el.dataset.piece ? "piece:" + el.dataset.piece : "seam:" + (el.dataset.go || "");
  const sel = document.getElementById("tuner-target");
  if ([...sel.options].some((o) => o.value === id)) sel.value = id;
  fillTuner();
  const spot = currentTune();
  if (!spot) return;
  measureUntuned(el, spot);
  fillTuner();
  tuneDrag = { id: event.pointerId, mode: handle ? handle.dataset.handle : "move", x: spot.x, y: spot.y, w: spot.w, h: spot.h || 0, r: spot.r, cx: event.clientX, cy: event.clientY };
  event.preventDefault();
}, true);
document.addEventListener("pointermove", (event) => {
  if (!tuneDrag || event.pointerId !== tuneDrag.id) return;
  const spot = currentTune();
  if (!spot) return;
  markTuned(spot);
  const dx = event.clientX - tuneDrag.cx;
  const dy = event.clientY - tuneDrag.cy;
  const target = document.getElementById("tuner-target").value;
  const seam = target.startsWith("seam:");
  const node = selectedTuneElement();
  const parent = node && node.offsetParent;
  const parentW = parent && parent.clientWidth ? parent.clientWidth : window.innerWidth;
  const parentH = parent && parent.clientHeight ? parent.clientHeight : window.innerHeight;
  const px = !seam && spot.unit === "px";
  const toX = (pixel) => seam ? pixel / window.innerWidth * 100 : px ? pixel : pixel / parentW * 100;
  const toY = (pixel) => seam ? pixel / window.innerHeight * 100 : px ? pixel : pixel / parentH * 100;
  if (tuneDrag.mode === "move") {
    spot.x = Math.round((tuneDrag.x + toX(dx)) * (px ? 1 : 10)) / (px ? 1 : 10);
    spot.y = Math.round((tuneDrag.y + toY(dy)) * (px ? 1 : 10)) / (px ? 1 : 10);
    if (px) {
      spot.x = Math.round(tuneDrag.x + dx);
      spot.y = Math.round(tuneDrag.y + dy);
    }
  } else if (tuneDrag.mode === "rotate") {
    const rect = node.getBoundingClientRect();
    const deg = Math.atan2(event.clientY - (rect.top + rect.height / 2), event.clientX - (rect.left + rect.width / 2)) * 180 / Math.PI + 90;
    spot.r = Math.round(event.shiftKey ? Math.round(deg / 15) * 15 : deg);
  } else {
    const mode = tuneDrag.mode;
    const west = mode === "nw" || mode === "sw" || mode === "w";
    const north = mode === "nw" || mode === "ne" || mode === "n";
    const east = mode === "ne" || mode === "se" || mode === "e";
    const south = mode === "sw" || mode === "se" || mode === "s";
    const growW = east || west;
    const growH = north || south;
    const widthUnit = seam || px ? (west ? -dx : dx) : (west ? -dx : dx) / parentW * 100;
    const heightUnit = px ? (north ? -dy : dy) : (north ? -dy : dy) / parentH * 100;
    if (growW) {
      const nextW = Math.max(seam || px ? 40 : 4, tuneDrag.w + widthUnit);
      spot.w = seam || px ? Math.round(nextW) : Math.round(nextW * 10) / 10;
      if (event.altKey) {
        spot.x = seam
          ? tuneDrag.x - (spot.w - tuneDrag.w) / window.innerWidth * 100 / 2
          : tuneDrag.x - (spot.w - tuneDrag.w) / 2;
      } else if (west) {
        spot.x = seam
          ? tuneDrag.x - (spot.w - tuneDrag.w) / window.innerWidth * 100
          : tuneDrag.x + tuneDrag.w - spot.w;
      }
    }
    if (growH && (spot.h || tuneDrag.h)) {
      const baseH = tuneDrag.h || spot.h;
      const nextH = Math.max(px ? 40 : 4, baseH + heightUnit);
      spot.h = px ? Math.round(nextH) : Math.round(nextH * 10) / 10;
      if (event.altKey) spot.y = tuneDrag.y - (spot.h - baseH) / 2;
      else if (north) spot.y = tuneDrag.y + baseH - spot.h;
    } else if (growW && spot.h && tuneDrag.h && !growH) {
      spot.h = Math.max(40, Math.round(tuneDrag.h * spot.w / tuneDrag.w));
    }
  }
  saveLayout();
  fillTuner();
});

      strokes: cocreate.strokes
    }));
  } catch (err) {}
}
function cocreateBoard() {
  return document.querySelector('[data-panel="main"] .board');
}
function boardPoint(event) {
  const board = cocreateBoard();
  const rect = board.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left) / rect.width,
    y: (event.clientY - rect.top) / rect.height
  };
}
function setCocreate(on) {
  cocreate.on = on;
  const board = cocreateBoard();
  const button = document.getElementById("cocreate-toggle");
  board.classList.toggle("is-cocreate", on);
  document.getElementById("controls").classList.toggle("is-locked", on);
  button.setAttribute("aria-pressed", on ? "true" : "false");
  button.setAttribute("aria-label", on ? "退出共创模式" : "开启共创模式");
  fitCocreateCanvas();
}
function fitCocreateCanvas() {
  const board = cocreateBoard();
  const canvas = document.getElementById("cocreate-ink");
  const width = board.offsetWidth;
  const height = board.offsetHeight;
  const ratio = window.devicePixelRatio || 1;
  if (canvas.width !== Math.round(width * ratio) || canvas.height !== Math.round(height * ratio)) {
    canvas.width = Math.round(width * ratio);
    canvas.height = Math.round(height * ratio);
  }
  drawCocreateInk();
}
function drawCocreateInk(live) {
  const canvas = document.getElementById("cocreate-ink");
  const ctx = canvas.getContext("2d");
  const ratio = window.devicePixelRatio || 1;
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const width = canvas.width / ratio;
  const height = canvas.height / ratio;
  const paint = (stroke) => {
    if (!stroke.points.length) return;
    ctx.beginPath();
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = "#1c1c1c";
    stroke.points.forEach((point, index) => {
      const x = point.x * width;
      const y = point.y * height;
      if (index === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.stroke();
  };
  cocreate.strokes.forEach(paint);
  if (live) paint(live);
}
function paintCocreateImages() {
  const host = document.getElementById("cocreate-items");
  host.innerHTML = cocreate.images.map((item) => `<div class="co-image" data-id="${item.id}" style="left:${item.x * 100}%;top:${item.y * 100}%;width:${item.w * 100}%;height:${item.h * 100}%"><img src="${item.src}" alt="" draggable="false"><span class="co-handle"></span></div>`).join("");
}
function placeCocreateImage(node) {
  const item = cocreate.images.find((entry) => entry.id === node.dataset.id);
  if (!item) return;
  node.style.left = (item.x * 100) + "%";
  node.style.top = (item.y * 100) + "%";
  node.style.width = (item.w * 100) + "%";
  node.style.height = (item.h * 100) + "%";
}
function clearCocreate() {
  cocreate.images = [];
  cocreate.strokes = [];
  cocreate.undo = [];
  paintCocreateImages();
  drawCocreateInk();
  saveCocreate();
}
function undoCocreate() {
  const step = cocreate.undo.pop();
  if (!step) return;
  if (step.kind === "image") cocreate.images = cocreate.images.filter((item) => item.id !== step.id);
  if (step.kind === "stroke") cocreate.strokes = cocreate.strokes.filter((stroke) => stroke.id !== step.id);
  if (step.kind === "geom") {
    const item = cocreate.images.find((entry) => entry.id === step.id);
    if (item) Object.assign(item, step.prev);
  }
  paintCocreateImages();
  drawCocreateInk();
  saveCocreate();
}
function addCocreateFiles(files, clientX, clientY) {
  const list = [...files].filter((file) => /png|jpe?g/i.test(file.type) || /\.(png|jpe?g)$/i.test(file.name));
  const point = { x: 0.35, y: 0.35 };
  if (Number.isFinite(clientX)) Object.assign(point, boardPoint({ clientX, clientY }));
  list.forEach((file, index) => {
    const reader = new FileReader();
    reader.onload = () => {
      const image = new Image();
      image.onload = () => {
        const board = cocreateBoard();
        const aspect = image.naturalWidth / image.naturalHeight || 1;
        const w = 0.28;
        const h = (w * board.offsetWidth) / aspect / board.offsetHeight;
        const item = {
          id: "i" + cocreate.seq++,
          src: reader.result,
          x: Math.min(0.92, Math.max(0, point.x + index * 0.03)),
          y: Math.min(0.92, Math.max(0, point.y + index * 0.03)),
          w: w,
          h: h
        };
        cocreate.images.push(item);
        cocreate.undo.push({ kind: "image", id: item.id });
        paintCocreateImages();
        saveCocreate();
      };
      image.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

const cocreateLayer = document.getElementById("cocreate-layer");
const cocreateToggle = document.getElementById("cocreate-toggle");
cocreateToggle.addEventListener("click", (event) => {
  event.stopPropagation();
  if (runtime.consoleOpen) return;
  setCocreate(!cocreate.on);
});
cocreateToggle.addEventListener("pointerover", (event) => {
  const tip = document.getElementById("seam-tip");
  if (!tip) return;
  tip.textContent = cocreate.on ? "退出共创模式" : "开启共创模式";
  tip.style.left = event.clientX + "px";
  tip.style.top = event.clientY + "px";
  tip.classList.add("is-shown");
});
cocreateToggle.addEventListener("pointermove", (event) => {
  const tip = document.getElementById("seam-tip");
  if (!tip || !tip.classList.contains("is-shown")) return;
  tip.style.left = event.clientX + "px";
  tip.style.top = event.clientY + "px";
});
cocreateToggle.addEventListener("pointerout", () => {
  const tip = document.getElementById("seam-tip");
  if (tip) tip.classList.remove("is-shown");
});
cocreateBoard().addEventListener("dragover", (event) => {
  if (!cocreate.on || runtime.view !== "main" || runtime.consoleOpen) return;
  event.preventDefault();
});
cocreateBoard().addEventListener("drop", (event) => {
  if (!cocreate.on || runtime.view !== "main" || runtime.consoleOpen) return;
  event.preventDefault();
  addCocreateFiles(event.dataTransfer.files, event.clientX, event.clientY);
});
cocreateLayer.addEventListener("pointerdown", (event) => {
  if (!cocreate.on || runtime.view !== "main" || runtime.consoleOpen || event.button !== 0) return;
  const image = event.target.closest(".co-image");
  if (image) {
    const item = cocreate.images.find((entry) => entry.id === image.dataset.id);
    coGesture = {
      kind: event.target.closest(".co-handle") ? "resize" : "move",
      id: item.id,
      pointer: event.pointerId,
      startX: event.clientX,
      startY: event.clientY,
      prev: { x: item.x, y: item.y, w: item.w, h: item.h },
      moved: false
    };
    image.setPointerCapture(event.pointerId);
    event.stopPropagation();
    return;
  }
  coGesture = { kind: "draw", pointer: event.pointerId, id: "s" + cocreate.seq++, points: [boardPoint(event)] };
  cocreateLayer.setPointerCapture(event.pointerId);
  event.preventDefault();
});
cocreateLayer.addEventListener("pointermove", (event) => {
  if (!coGesture || event.pointerId !== coGesture.pointer) return;
  const board = cocreateBoard();
  const rect = board.getBoundingClientRect();
  if (coGesture.kind === "draw") {
    coGesture.points.push(boardPoint(event));
    drawCocreateInk(coGesture);
    return;
  }
  const item = cocreate.images.find((entry) => entry.id === coGesture.id);
  const dx = (event.clientX - coGesture.startX) / rect.width;
  const dy = (event.clientY - coGesture.startY) / rect.height;
  if (Math.hypot(event.clientX - coGesture.startX, event.clientY - coGesture.startY) > 3) coGesture.moved = true;
  if (coGesture.kind === "move") {
    item.x = coGesture.prev.x + dx;
    item.y = coGesture.prev.y + dy;
  } else {
    item.w = Math.max(0.04, coGesture.prev.w + dx);
    item.h = Math.max(0.04, coGesture.prev.h + dy);
  }
  const node = document.querySelector('.co-image[data-id="' + item.id + '"]');
  if (node) placeCocreateImage(node);
});
cocreateLayer.addEventListener("pointerup", (event) => {
  if (!coGesture || event.pointerId !== coGesture.pointer) return;
  const gesture = coGesture;
  coGesture = null;
  if (gesture.kind === "draw") {
    if (gesture.points.length > 1) {
      cocreate.strokes.push({ id: gesture.id, points: gesture.points });
      cocreate.undo.push({ kind: "stroke", id: gesture.id });
      saveCocreate();
    }
    drawCocreateInk();
    return;
  }
  if ((gesture.kind === "move" || gesture.kind === "resize") && gesture.moved) {
    cocreate.undo.push({ kind: "geom", id: gesture.id, prev: gesture.prev });
    saveCocreate();
  } else if (gesture.kind === "move" || gesture.kind === "resize") {
    const item = cocreate.images.find((entry) => entry.id === gesture.id);
    if (item) Object.assign(item, gesture.prev);
  }
});
window.addEventListener("resize", fitCocreateCanvas);
document.querySelector('[data-panel="main"] .grid').addEventListener("load", fitCocreateCanvas);
paintCocreateImages();
fitCocreateCanvas();

runtime.view = "main";
runtime.ownFace = "back";
runtime.inspectId = null;
mount();

</script>
</body>
</html>
