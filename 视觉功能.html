<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>视觉功能</title>
  <link rel="icon" href="data:,">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #e7d3b0; }
    button, input, textarea, select { font: 14px/1.4 "Microsoft YaHei", sans-serif; color: #1c1c1c; }
    button { cursor: pointer; }
    .desk { position: fixed; inset: 0; background: url("前端视觉素材/桌面背景图.png") center / cover no-repeat; }
    .viewport { position: fixed; inset: 0; overflow: hidden; }
    .stage {
      position: absolute; left: 0; top: 0; width: 300vw; height: 300vh;
      display: grid; grid-template-columns: 100vw 100vw 100vw; grid-template-rows: 100vh 100vh 100vh;
      transform: translate(-100vw, -100vh);
      transition: transform 920ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .stage[data-view="chat"] { transform: translate(-100vw, 0); }
    .stage[data-view="handoff"] { transform: translate(0, -100vh); }
    .stage[data-view="schedule"] { transform: translate(-200vw, -100vh); }
    .stage[data-view="project"] { transform: translate(-100vw, -200vh); }
    .panel { position: relative; }
    .slip { position: absolute; height: auto; pointer-events: none; }
    .board { position: absolute; }
    .grid { display: block; width: 100%; height: auto; pointer-events: none; }
    .note {
      position: absolute; margin: 0; padding: 22px 10px;
      background: url("前端视觉素材/主界面/界面材质-纸1.png") center / cover no-repeat;
      text-align: center; font: 700 18px/1.4 "Microsoft YaHei", sans-serif; color: #1c1c1c;
      box-shadow: 0 8px 16px rgba(40, 30, 10, 0.16);
    }
    .pencil { position: absolute; height: auto; pointer-events: none; }
    .on-grid { display: none; }
    .ui-panel {
      position: absolute; z-index: 3; overflow: visible; padding: 0;
      background: none;
    }
    .ui-panel button, .ui-panel input, .ui-panel textarea, .ui-panel select,
    .card-tools button, .notice, .box, .person, .req, .submission, .annotation {
      background: none; border: 0; color: #1c1c1c; box-shadow: none;
    }
    .panel[data-panel="chat"] { grid-column: 2; grid-row: 1; }
    .panel[data-panel="handoff"] { grid-column: 1; grid-row: 2; }
    .panel[data-panel="main"] { grid-column: 2; grid-row: 2; }
    .panel[data-panel="schedule"] { grid-column: 3; grid-row: 2; }
    .panel[data-panel="project"] { grid-column: 2; grid-row: 3; }
    .placeholder-note {
      position: absolute; left: 18%; top: 22%; width: 280px; margin: 0; padding: 28px 16px;
      background: url("前端视觉素材/主界面/界面材质-纸1.png") center / cover;
      text-align: center; font-weight: 700; box-shadow: 0 8px 16px rgba(40,30,10,.16);
    }
    #cocreate-toggle { pointer-events: auto; border: 0; background: none; padding: 0; cursor: pointer; }
    #cocreate-toggle img {
      width: 100%; height: auto; display: block; pointer-events: none;
      transform-origin: 62% 78%; transition: transform 220ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    #cocreate-toggle:hover img { transform: rotate(-12deg); }
    .cocreate-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
    .cocreate-layer canvas { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #cocreate-items { position: absolute; inset: 0; }
    .co-image { position: absolute; pointer-events: none; }
    .co-image img { width: 100%; height: 100%; object-fit: fill; display: block; pointer-events: none; }
    .co-handle {
      display: none; position: absolute; right: -7px; bottom: -7px; width: 14px; height: 14px;
      background: #5c4d9a; border: 1px solid #222; cursor: nwse-resize;
    }
    .board.is-cocreate .cocreate-layer { pointer-events: auto; cursor: crosshair; }
    .board.is-cocreate .co-image { pointer-events: auto; cursor: grab; }
    .board.is-cocreate .co-handle { display: block; }
    .slot { position: absolute; inset: 0; }
    .chat-pop {
      position: absolute; left: 50%; top: 0; z-index: 8; width: 180px; padding: 0; border: 0; background: transparent;
      transform: translate(-50%, -110%); transition: transform 520ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .chat-pop.is-shown { transform: translate(-50%, 10px); }
    .chat-pop img { width: 100%; height: auto; image-rendering: pixelated; }
    .handoff-layout, .sheet { position: absolute; inset: 0; }
    .own-slot, .other-tray { position: absolute; }
    .chat-sheet, .project-sheet, .dock, .block, .own-text, .own-link {
      background: none;
    }
    .ui-panel button, .ui-panel input, .ui-panel textarea, .ui-panel select,
    .card-tools button, .card-tools input, .card-tools select,
    .chat-sheet button, .chat-sheet textarea,
    .project-sheet button, .project-sheet input, .project-sheet select,
    .dock button, .dock input, .dock textarea, .dock select {
      background: none; border: 0; border-radius: 0; padding: 6px 8px; color: #1c1c1c; box-shadow: none;
    }
    .flip { width: 100%; height: 100%; }
    .own-slot { perspective: 1200px; display: flex; flex-direction: column; }
    .own-slot > .flip { position: absolute; inset: 0; height: auto; }
    .mini { perspective: 800px; }
    .flip-inner {
      position: relative; width: 100%; height: 100%;
      transform-style: preserve-3d;
      transition: transform 800ms cubic-bezier(0.22, 1, 0.36, 1);
    }
    .flip-inner.is-front { transform: rotateY(180deg); }
    .flip-face {
      position: absolute; inset: 0;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .flip-back img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .flip-front { transform: rotateY(180deg); background: url("前端视觉素材/交接卡/卡面.png") center / 100% 100% no-repeat; }
    .flip-hit { position: absolute; inset: 0; z-index: 2; padding: 0; border: 0; background: transparent; }
    .flip-inner.is-front ~ .flip-hit { pointer-events: none; }
    .card-tools, .card-tools .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 10px; }
    .card-stage { position: absolute; inset: 0; overflow: hidden; }
    .card-world { width: 360px; height: 480px; transform-origin: 0 0; }
    .card-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
    .card-tools button, .card-tools select, .card-tools input { background: none; border: 0; padding: 4px 6px; }
    .own-slot { left: 4%; top: 8%; width: 18%; height: 42%; z-index: 4; }
    .other-tray { left: 4%; top: 54%; width: 28%; height: 38%; z-index: 4; display: flex; gap: 8px; align-items: flex-end; }
    .other-tray .mini { position: relative; width: 86px; height: 120px; }
    .other-tray:has(.mini.is-open) { z-index: 36 !important; }
    .mini.is-open {
      position: fixed; left: 50%; top: 50%; width: 320px; height: 448px; z-index: 40;
      transform: translate(-50%, -50%);
    }
    .dock { left: auto; top: auto; width: auto; height: auto; z-index: 2; }
    .dim { position: fixed; inset: 0; z-index: 35; border: 0; background: rgba(20,16,8,.46); }
    .card-face { position: absolute; inset: 0; background: transparent; transform: none; }
    .layer { position: absolute; inset: 0; }
    .layer-ink { width: 100%; height: 100%; pointer-events: none; }
    .layer-ink path { fill: none; stroke: #1c1c1c; stroke-width: 2; }
    .item { position: absolute; }
    .block { padding: 6px; overflow: auto; }
    .handle { position: absolute; right: 0; bottom: 0; width: 12px; height: 12px; background: #1c1c1c; cursor: nwse-resize; }
    .canvas-header, .card-title, .badge, .reject-count { font-size: 12px; }
    .chat-sheet { display: flex; flex-direction: column; min-height: 70%; padding: 8px; background: transparent; box-shadow: none; }
    .chat-log { flex: 1; overflow: auto; list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
    .chat-log li { max-width: 72%; padding: 8px 10px; background: none; }
    .chat-compose { display: flex; gap: 8px; }
    .chat-compose textarea { flex: 1; min-height: 52px; }
    .chat-gate { margin: 0 0 8px; font-weight: 700; }
    .project-sheet { overflow: auto; padding: 8px; }
    .project-top, .project-bottom { display: grid; gap: 16px; align-items: start; }
    .project-top { grid-template-columns: 1fr 1fr; }
    .project-bottom { grid-template-columns: 1fr 1fr 1fr; margin-top: 16px; }
    .project-sheet { display: flex; flex-direction: column; gap: 12px; }
    .object-list { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; }
    .box { min-width: 0; }
    .ui-panel .composer, .ui-panel .actions { display: flex; flex-direction: column; align-items: stretch; gap: 12px; }
    .ui-panel .inline { display: flex; gap: 8px; align-items: flex-end; }
    .ui-panel .inline textarea { flex: 1; min-height: 64px; }
    .ui-panel select, .ui-panel input[type="text"], .ui-panel textarea { width: 100%; min-height: 44px; }
    #slot-handoff { max-height: 86%; }
    .chat-compose button { flex: 0 0 96px; min-height: 72px; }
    .object-list { list-style: none; padding: 0; }
    .object-list .is-on { outline: 2px solid #1c1c1c; font-weight: 700; }
    .tree, .log { white-space: pre-wrap; font-family: Consolas, monospace; font-size: 12px; }
    .controls { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
    .seam {
      position: absolute; pointer-events: auto; border: 0; background: transparent; padding: 0;
      transition: left 920ms cubic-bezier(0.22, 1, 0.36, 1),
        top 920ms cubic-bezier(0.22, 1, 0.36, 1),
        width 920ms cubic-bezier(0.22, 1, 0.36, 1),
        transform 920ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 320ms ease;
    }
    .seam img { display: block; width: 100%; height: auto; }
    .seam .on { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 420ms ease; }
    .seam-shift { position: relative; display: block; width: 100%; transition: transform 320ms cubic-bezier(0.22, 1, 0.36, 1); }
    .seam:hover .seam-shift { transform: translate(var(--hx, 0px), var(--hy, 0px)); }
    .controls.is-locked .seam { pointer-events: none; }
    .seam-tip {
      position: fixed; z-index: 6; transform: translate(14px, -130%);
      padding: 6px 10px; background: #e7e3da; border: 1px solid #2b2b2b; color: #1c1c1c;
      font: 700 14px/1.3 "Microsoft YaHei", sans-serif; white-space: nowrap;
      pointer-events: none; opacity: 0; transition: opacity 160ms ease;
    }
    .seam-tip.is-shown { opacity: 1; }
    body.is-debug .seam-tip { display: none; }
    .seam-handoff img, .seam-project img, .seam-chat img { image-rendering: pixelated; }
    .seam-handoff .pack { position: relative; display: block; width: 100%; }
    .seam-handoff .pack.on { position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 1; }
    .seam-handoff .pack.on img { opacity: 0; transition: opacity 420ms ease; will-change: opacity; }
    .controls[data-view="handoff"] .seam-handoff .pack.on img { opacity: 1; }
    .seam-handoff .pack img { transform-origin: 50% 50%; filter: drop-shadow(4px 8px 0 rgba(30, 24, 16, 0.2)); }
    .seam-handoff .pack img[data-layer="0"] { position: relative; z-index: 1; }
    .seam-handoff .pack img[data-layer="1"] { position: absolute; left: 0; top: 0; z-index: 2; }
    .seam-handoff .pack img[data-layer="2"] { position: absolute; left: 0; top: 0; z-index: 3; }
    .controls[data-view="chat"] .seam-chat .on,
    .controls[data-view="handoff"] .seam-handoff .on,
    .controls[data-view="schedule"] .seam-schedule .on,
    .controls[data-view="project"] .seam-project .on { opacity: 1; }
    .controls:not([data-view="main"]) .seam { opacity: 0; pointer-events: none; }
    .controls[data-view="chat"] .seam-chat,
    .controls[data-view="handoff"] .seam-handoff,
    .controls[data-view="schedule"] .seam-schedule,
    .controls[data-view="project"] .seam-project { opacity: 1; pointer-events: auto; }
    .console {
      position: fixed; left: 16px; top: 16px; z-index: 50; width: 320px; max-height: calc(100vh - 32px); overflow: auto;
      padding: 12px; background: #e7e3da; border: 1px solid #222;
    }
    .console[hidden] { display: none; }
    .console h2 { margin: 0 0 8px; cursor: grab; user-select: none; }
    .console label { display: grid; grid-template-columns: 52px 1fr 64px; gap: 6px; align-items: center; margin: 6px 0; }
    .console .row { display: flex; gap: 6px; margin-top: 8px; }
    body.is-debug .slip,
    body.is-debug .pencil,
    body.is-debug .note,
    body.is-debug [data-piece],
    body.is-debug .grid { pointer-events: auto; }
    .own-slot, .mini, .flip { transform-style: preserve-3d; }
    .ui-panel .panel { position: static; width: auto; height: auto; }
    .ui-panel h2 { margin: 0 0 8px; font-size: 18px; }
    .ui-panel .field, .ui-panel fieldset.field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; }
    .ui-panel .checks { display: flex; flex-wrap: wrap; gap: 6px 12px; }
    .ui-panel button { margin: 0 6px 6px 0; }
    .chat-sheet { display: flex; flex-direction: column; gap: 8px; height: 100%; }
    .chat-log { flex: 1; overflow: auto; margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
    .chat-compose { display: flex; gap: 8px; align-items: flex-end; }
    .chat-compose textarea { flex: 1; min-height: 72px; }
    .chat-compose textarea { flex: 1; min-height: 72px; }
    #xform { position: fixed; inset: 0; z-index: 45; pointer-events: none; }
    #xform[hidden] { display: none; }
    .xform-box { position: absolute; outline: 1.5px solid #0b99ff; transform-origin: center center; }
    .xform-box span { position: absolute; width: 11px; height: 11px; background: #fff; border: 1.5px solid #0b99ff; pointer-events: auto; transform: translate(-50%, -50%); }
    .xform-box [data-handle="nw"] { left: 0; top: 0; }
    .xform-box [data-handle="ne"] { left: 100%; top: 0; }
    .xform-box [data-handle="se"] { left: 100%; top: 100%; }
    .xform-box [data-handle="sw"] { left: 0; top: 100%; }
    .xform-box [data-handle="n"] { left: 50%; top: 0; }
    .xform-box [data-handle="e"] { left: 100%; top: 50%; }
    .xform-box [data-handle="s"] { left: 50%; top: 100%; }
    .xform-box [data-handle="w"] { left: 0; top: 50%; }
    .xform-box [data-handle="rotate"] { left: 50%; top: -22px; border-radius: 50%; }

    .ui-panel { background: none; padding: 0; overflow: visible; }
    #slot-handoff, #slot-chat, #slot-project { overflow: visible; background: none; }
    .win, .card-tools, .term-win {
      font-family: Tahoma, "Microsoft YaHei", sans-serif;
    }
    .win {
      background: #e7e3da; color: #1c1c1c;
      border: 1px solid #2b2b2b; border-radius: 2px;
      box-shadow: 0 10px 24px rgba(30, 24, 16, .16);
      display: flex; flex-direction: column; min-height: 0;
    }
    .win-bar {
      display: flex; align-items: center; justify-content: space-between;
      min-height: 32px; margin: 0; padding: 0 6px 0 12px;
      background: #5c4d9a; color: #fff; cursor: grab;
      font: 700 13px/1 Tahoma, "Microsoft YaHei", sans-serif; letter-spacing: .04em;
    }
    .win-bar:active { cursor: grabbing; }
    .win-ctl { display: flex; gap: 4px; }
    .win-ctl span {
      width: 22px; height: 18px; display: inline-flex; align-items: center; justify-content: center;
      background: #eceae4; color: #222; border: 1px solid #b7b3aa; border-radius: 2px;
      font: 700 11px/1 Tahoma, sans-serif;
    }
    .win-body { padding: 12px 14px 14px; overflow: auto; background: #e7e3da; max-height: 68vh; }
    .win .panel > h2 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
    .win button, .card-tools button {
      background: #ebe7df; color: #1c1c1c; border-radius: 2px;
      border: 1px solid #2b2b2b; box-shadow: none; padding: 6px 12px;
    }
    .win button:active, .card-tools button:active, .card-tools button[aria-pressed="true"] {
      background: #d9d4c8;
    }
    .win input, .win textarea, .win select, .card-tools input, .card-tools select {
      background: #ebe7df; color: #1c1c1c; border-radius: 2px; width: 100%; min-height: 28px;
      border: 1px solid #2b2b2b; box-shadow: none; padding: 4px 8px;
    }
    .win textarea { min-height: 72px; resize: vertical; }
    .win .field { display: flex; flex-direction: column; gap: 6px; margin: 0 0 14px; }
    .win .field > span, .win label > span { font-size: 14px; }
    .composer > .field:first-child select { width: 168px; align-self: flex-start; }
    .attach-controls { display: flex; align-items: center; gap: 8px; }
    .attach-controls select { flex: 1; width: auto; min-width: 0; }
    .attach-controls button { margin: 0; flex: 0 0 auto; }
    .win .requirement { counter-increment: req; background: #f3f0e8; border: 1px solid #2b2b2b; border-radius: 2px; padding: 8px 10px; margin-top: 10px; }
    .win .requirement header { color: #000; font-size: 12px; }
    .win .submission { display: grid; grid-template-columns: 28px 1fr; gap: 4px 10px; align-items: start; }
    .win .submission::before {
      content: counter(req); grid-row: 1 / span 3;
      width: 22px; height: 22px; border: 1px solid #ccc; border-radius: 50%;
      text-align: center; line-height: 20px; font-size: 12px;
    }
    .annotation.is-empty { display: none; }
    .win .annotation { background: #ffffe1; border: 1px solid #000; padding: 6px 8px; margin: 0 0 10px; }
    .flip-front { background: #fff; border-radius: 18px; }
    .flip-back img, .flip-front { border-radius: 18px; }
    .card-kicker {
      position: absolute; z-index: 4; left: 16px; top: 12px; margin: 0;
      font: 700 13px/1 "Microsoft YaHei", sans-serif; letter-spacing: .04em; color: #9a9a9a;
      pointer-events: none;
    }
    .card-kicker.is-other { color: #e07a1a; }
    .card-tools {
      position: absolute; left: 0; top: calc(100% + 8px); z-index: 8;
      width: max(100%, 300px); margin: 0; padding: 6px;
      display: block; background: #e7e3da; border-radius: 2px;
      border: 1px solid #2b2b2b;
    }
    .card-tools[hidden] { display: none; }
    .card-tools .tools { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .card-tools button[aria-pressed="true"] { background: #c0c0c0; color: #000; }
    body.is-debug .flip-hit { pointer-events: none; }
    .own-text, .own-link { cursor: grab; user-select: none; background: #fff; border: 1px dashed #000; padding: 2px 6px; }
    .own-text .handle, .block .handle { z-index: 2; }
    .other-tray .mini { width: 138px; height: 176px; }
    #slot-chat { pointer-events: none; }
    #slot-chat .win, #slot-chat .term-win { pointer-events: auto; }
    #slot-chat .win { width: min(680px, 70%); height: 58%; margin: 6% auto 0; }
    #slot-chat .win-body { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    #slot-chat .chat-log { flex: 1; }
    .win .chat-log { gap: 0; display: flex; flex-direction: column; }
    .win .chat-log li {
      max-width: none; align-self: stretch; background: #fff; border: 0; border-radius: 0;
      border-bottom: 1px solid #808080; padding: 6px 4px; box-shadow: none; color: #000;
    }
    .win .chat-log li b { display: block; }
    .win .chat-log li p { margin: 4px 0 0; }
    .win .chat-compose { display: flex; gap: 6px; align-items: center; background: transparent; padding: 8px 0 0; }
    .win .chat-compose textarea { flex: 1; min-height: 42px; }
    .win .chat-compose button { flex: 0 0 72px; min-height: 40px; }
    .term-win {
      position: absolute; left: 2%; bottom: 8%; width: 250px; z-index: 4;
      background: #111; color: #d8d8d8; border-radius: 2px;
      border: 1px solid #2b2b2b; cursor: grab;
      font: 12px/1.45 Consolas, monospace;
    }
    .term-win header { display: flex; justify-content: flex-end; gap: 3px; padding: 4px 6px; background: #5c4d9a; color: #fff; cursor: grab; }
    .term-win header span {
      width: 16px; height: 14px; display: inline-flex; align-items: center; justify-content: center;
      background: #eceae4; color: #222; border: 1px solid #b7b3aa; font: 700 10px/1 Tahoma, sans-serif;
    }
    .term-win pre { margin: 0; padding: 4px 12px 12px; white-space: pre-wrap; }
    #slot-project .win { height: 100%; }

    .file-row select { width: auto; min-width: 88px; }

    .object-list li { padding: 2px 6px; background: #fff; border: 1px solid #808080; }
    .object-list .is-on { background: #000080; color: #fff; outline: none; }
  </style>
</head>
<body id="app">
  <div class="desk"></div>
  <div class="viewport">
    <div class="stage" id="stage" data-view="main">
      <section class="panel" data-panel="chat">
        <img class="slip" data-piece="chat-slip-l" src="前端视觉素材/主界面/界面材质-纸2.png" alt="">
        <img class="slip" data-piece="chat-slip-r" src="前端视觉素材/主界面/界面材质-纸3.png" alt="">
        <div class="board" data-piece="chat-board">
          <img class="grid" data-piece="chat-grid" src="前端视觉素材/主界面/界面材质-网格纸.png" alt="">
        </div>
        <div id="slot-chat" class="ui-panel" data-piece="chat-ui"></div>
      </section>

    <span data-handle="nw"></span><span data-handle="n"></span><span data-handle="ne"></span>

  <script>

/* === CONFIG-BEGIN === */
// 改这一处即可切换行为，不要把可配置项散落到代码里。
const CONFIG = {
  // 是否显示「载入演示剧本」按钮（一键预置到走查「发放之后」的状态）。
  showDemoScriptButton: true,
  // 本地存储键。与旧原型用的那个键完全无关，互不污染。
  storageKey: "handoff-visual-v1",
};
globalThis.__HANDOFF_CONFIG__ = CONFIG;
/* === CONFIG-END === */

/* === CORE-BEGIN === */
// 核心层（"后端"）：纯函数。禁止出现 document / window / localStorage / Date /
// Math.random / 定时器 / 任何渲染技术概念。同输入必得同输出，且绝不原地修改传入的 core。
"use strict";

const ACTIONS = {
  HANDOVER_CREATE: "handover/create",
  REQUIREMENT_NEW: "requirement/new",
  REQUIREMENT_SET_DRAFT: "requirement/setDraft",
  REQUIREMENT_ADOPT_SUGGESTION: "requirement/adoptSuggestion",
  REQUIREMENT_SET_SUGGESTION: "requirement/setSuggestion",
  REQUIREMENT_SUBMIT: "requirement/submit",
  SUBMISSION_ACCEPT: "submission/accept",
  SUBMISSION_REJECT: "submission/reject",
  SUBMISSION_COMMENT: "submission/comment",
  CANVAS_ADD_INK: "canvas/addInk",
  CANVAS_REMOVE_INK: "canvas/removeInk",
  CANVAS_UNDO: "canvas/undo",
  CANVAS_ADD_TEXT: "canvas/addText",
  CANVAS_UPDATE_TEXT: "canvas/updateText",
  CANVAS_REMOVE_TEXT: "canvas/removeText",
  CANVAS_MOVE_TEXT: "canvas/moveText",
  CANVAS_ADD_OWN_LINK: "canvas/addOwnLink",
  CANVAS_REMOVE_OWN_LINK: "canvas/removeOwnLink",
  CANVAS_MOVE_OWN_LINK: "canvas/moveOwnLink",
  CANVAS_MOVE_BLOCK: "canvas/moveBlock",
  CANVAS_RESIZE_BLOCK: "canvas/resizeBlock",
  CANVAS_UPLOAD: "canvas/upload",
  CANVAS_EXIT_EDIT: "canvas/exitEdit",
  CHAT_SEND: "chat/send",
};

// 界面中文文案集中在此。核心层与视图层都只从这里取词，不硬编码中文。
const TEXT = {
  statusNeverUploaded: "未上传",
  statusUploaded: "已上传",
  statusEditing: "编辑中",
  statePendingReply: "待回应",
  stateAgreed: "已共识",
  stateNeedsRewrite: "待重写",
  roundCurrent: "当前轮",
  roundPrevious: "上一轮",
  rejectGateUnlocked: "已经打回超过三次，可以临时聊一次。",
  suggestionDisclaimer: "建议由页面内固定规则生成，不调用模型。",
};

// 卡面与共识块的几何常量。
const CARD = { w: 360, h: 480 };
const BLOCK_DEFAULT = { w: 280, h: 88 };
const BLOCK_MIN = { w: 160, h: 64 };
const BLOCK_GAP = 16;

// 渲染顺序的单一事实来源（v2 L58：绘制层位于共识块之下）。视图层不得另行硬编码层序。
const LAYER_ORDER = ["ink", "ownLinks", "ownTexts", "blockInstances"];

function emptyContent() {
  return { ink: [], texts: [], links: [], blockInstances: [] };
}

// 核心状态是纯 JSON 数据，因此用 JSON 深拷贝即可保证 copy-on-write。
function clone(value) {
  return JSON.parse(JSON.stringify(value));
}

function createCore({ level, thing, initiatorName, participantNames }) {
  const core = {
    seq: 1,
    handover: {
      level,
      thing,
      initiatorId: null,
      holderIds: [],
      rejectCount: 0,
      chat: { messages: [] },
    },
    holders: {},
    cards: {},
    blocks: {},
    requirements: [],
  };

  // 发起者恒为第一个人；参与者名单去重，且不因重复出现而多发一张卡（v2 L92）。
  const names = [initiatorName];
  for (const name of participantNames || []) {
    if (!names.includes(name)) names.push(name);
  }

  names.forEach((name, index) => {
    const holderId = "h" + (index + 1);
    const cardId = "c" + (index + 1);
    const isInitiator = index === 0;

    core.holders[holderId] = { id: holderId, name, isInitiator, cardId };
    core.cards[cardId] = {
      id: cardId,
      holderId,
      level,
      thing,
      holder: name,
      uploadedOnce: false,
      visible: emptyContent(),
      draft: null,
    };
    core.handover.holderIds.push(holderId);
    if (isInitiator) core.handover.initiatorId = holderId;
  });

  return core;
}

// action 处理器表：每个处理器只用 { check, apply } 两个纯函数描述。
// check 在副本产生之前运行，因此拒绝路径上任何状态都不会被改动。
const HANDLERS = {};

function dispatch(core, action) {
  if (!action || typeof action.type !== "string") {
    return { ok: false, error: "UNKNOWN_ACTION", core };
  }
  const handler = HANDLERS[action.type];
  if (!handler) return { ok: false, error: "UNKNOWN_ACTION", core };

  const problem = handler.check ? handler.check(core, action) : null;
  if (problem) return { ok: false, error: problem, core };

  const next = clone(core);
  handler.apply(next, action);
  return { ok: true, core: next };
}

// —— 派生量：不存储，避免双写不一致 ——

function cardStatus(core, cardId) {
  const card = core.cards[cardId];
  if (!card) return null;
  if (card.draft !== null) return "editing";
  return card.uploadedOnce ? "uploaded" : "neverUploaded";
}

function cardOfHolder(core, holderId) {
  const holder = core.holders[holderId];
  return holder ? core.cards[holder.cardId] : null;
}

function holderList(core) {
  return core.handover.holderIds.map((id) => core.holders[id]);
}

// —— 对接记录：要求、提交、意见 ——

function findRequirement(core, reqId) {
  return core.requirements.find((r) => r.id === reqId) || null;
}

// 原始存储访问器。可见性由 recordFor / suggestionFor 强制，视图层不得用它绕过投影。
function requirementOf(core, reqId) {
  return findRequirement(core, reqId);
}

// "条"的状态只是其当前提交状态的投影（规格 §4.1 T11 / P0-3）。
function requirementStatus(core, reqId) {
  const req = findRequirement(core, reqId);
  if (!req || !req.currentSubmissionId) return null;
  const submission = req.submissions.find((s) => s.id === req.currentSubmissionId);
  return submission ? submission.state : null;
}

// 对接记录的可见性投影：发起者见全部；接收人只见自己那条；其余为空（v2 L98）。
// 非发起者拿到的投影里连 suggestion 字段都不存在——I9 由核心层结构性保证。
function recordFor(core, holderId) {
  const isInitiator = holderId === core.handover.initiatorId;
  return core.requirements
    .filter((r) => isInitiator || r.receiverId === holderId)
    .map((r) => {
      const view = clone(r);
      if (!isInitiator) delete view.suggestion;
      return view;
    });
}

// 书写建议只对发起者可读（v2 L96 / I9）。
function suggestionFor(core, reqId, viewerHolderId) {
  if (viewerHolderId !== core.handover.initiatorId) return null;
  const req = findRequirement(core, reqId);
  return req ? req.suggestion : null;
}

// 页面内固定规则，不调用模型。界面必须显示 TEXT.suggestionDisclaimer。
function makeSuggestion(draftText, receiverName) {
  const text = String(draftText || "")
    .trim()
    .replace(/^(我觉得|那个|就是|请|麻烦|帮我|能不能)/, "");
  if (!text) return null;

  if (/压过|盖过|太响|听不见/.test(text)) {
    return {
      understanding: receiverName + " 可能理解为「这段声音的音量不能盖过脚步」",
      usable: "短，干，不能盖过脚步",
    };
  }
  if (/太亮|不要亮|刺眼|抢眼/.test(text)) {
    return {
      understanding: receiverName + " 可能理解为「这张图不能太抢眼」",
      usable: "压暗，不抢这一关的主体",
    };
  }
  if (/看不清|太小/.test(text)) {
    return {
      understanding: receiverName + " 可能理解为「这个对象在这一关里要一眼认得出」",
      usable: "放大到这一关里能一眼认出",
    };
  }
  return {
    understanding: receiverName + " 可能理解为「按这句话字面执行」",
    usable: text.replace(/[。！!？?]+$/g, "") || text,
  };
}

HANDLERS[ACTIONS.REQUIREMENT_NEW] = {
  check(core, action) {
    if (action.actorId !== core.handover.initiatorId) return "NOT_INITIATOR";
    if (!core.holders[action.receiverId]) return "NOT_FOUND";
    if (action.receiverId === core.handover.initiatorId) return "RECEIVER_IS_INITIATOR";
    return null;
  },
  apply(next, action) {
    next.requirements.push({
      id: "r" + next.seq++,
      initiatorId: next.handover.initiatorId,
      receiverId: action.receiverId,
      draftText: "",
      suggestion: null,
      submissions: [],
      currentSubmissionId: null,
    });
  },
};

HANDLERS[ACTIONS.REQUIREMENT_SET_DRAFT] = {
  check(core, action) {
    if (action.actorId !== core.handover.initiatorId) return "NOT_INITIATOR";
    const req = findRequirement(core, action.reqId);
    if (!req) return "NOT_FOUND";
    // T11：已共识的条不能由发起者主动改写再提交（v2 L100 只给了"待回应期间"这个窗口）。
    // 要改只有两条路：接收人先打回，或按 v2 L102 新开一条要求。
    if (isCurrentAgreed(core, req)) return "AGREED_CANNOT_REVISE";
    return null;
  },
  apply(next, action) {
    const req = findRequirement(next, action.reqId);
    req.draftText = String(action.text == null ? "" : action.text);
    req.suggestion = makeSuggestion(req.draftText, next.holders[req.receiverId].name);
  },
};

HANDLERS[ACTIONS.REQUIREMENT_ADOPT_SUGGESTION] = {
  check(core, action) {
    if (action.actorId !== core.handover.initiatorId) return "NOT_INITIATOR";
    const req = findRequirement(core, action.reqId);
    if (!req) return "NOT_FOUND";
    if (isCurrentAgreed(core, req)) return "AGREED_CANNOT_REVISE";
    if (!req.suggestion) return "NO_SUGGESTION";
    return null;
  },
  apply(next, action) {
    const req = findRequirement(next, action.reqId);
    // v2 L96：发起者**可以**把建议中的文字写入自己的句子，系统不替换。
    // 区别就在这一步由发起者点按触发——系统从不自作主张。
    req.draftText = req.suggestion.usable;
    req.suggestion = makeSuggestion(req.draftText, next.holders[req.receiverId].name);
  },
};

// 建议由谁生成，核心层不管：规则版在核心层内同步算出来，落地版由外部（模型）异步算出来。
// 这个 action 只负责把结果收下来——核心层是纯函数，禁止定时器与网络，所以异步绝不能进来。
// 边界仍然由核心层守住：只有发起者能触发、脏数据不收、已共识不收。
HANDLERS[ACTIONS.REQUIREMENT_SET_SUGGESTION] = {
  check(core, action) {
    if (action.actorId !== core.handover.initiatorId) return "NOT_INITIATOR";
    const req = findRequirement(core, action.reqId);
    if (!req) return "NOT_FOUND";
    if (isCurrentAgreed(core, req)) return "AGREED_CANNOT_REVISE";

    const suggestion = action.suggestion;
    if (!suggestion || typeof suggestion !== "object") return "BAD_SUGGESTION";
    if (typeof suggestion.understanding !== "string" || typeof suggestion.usable !== "string") return "BAD_SUGGESTION";
    if (!suggestion.understanding.trim() || !suggestion.usable.trim()) return "BAD_SUGGESTION";
    return null;
  },
  apply(next, action) {
    const req = findRequirement(next, action.reqId);
    req.suggestion = {
      understanding: action.suggestion.understanding,
      usable: action.suggestion.usable,
      // 不认识就退回归则为 rule：旧存档没有这个字段，界面按规则处理即可，不该抛错。
      source: action.suggestion.source === "model" ? "model" : "rule",
    };
  },
};

HANDLERS[ACTIONS.REQUIREMENT_SUBMIT] = {
  check(core, action) {    if (action.actorId !== core.handover.initiatorId) return "NOT_INITIATOR";
    const req = findRequirement(core, action.reqId);
    if (!req) return "NOT_FOUND";
    if (isCurrentAgreed(core, req)) return "AGREED_CANNOT_REVISE";
    if (!String(req.draftText || "").trim()) return "EMPTY_SENTENCE";
    return null;
  },
  apply(next, action) {
    const req = findRequirement(next, action.reqId);
    const submission = {
      id: "s" + next.seq++,
      rawSentence: req.draftText,
      attachmentLink: action.attachmentLink || null,
      state: "pendingReply",
      opinions: [],
    };
    req.submissions.push(submission);
    req.currentSubmissionId = submission.id;
    req.suggestion = null; // v2 L134：提交后从发起者的书写位置撤下
  },
};

// —— 共识块与画布可见性 ——

function currentSubmission(core, req) {
  if (!req || !req.currentSubmissionId) return null;
  return req.submissions.find((s) => s.id === req.currentSubmissionId) || null;
}

function blockOf(core, blockId) {
  return core.blocks[blockId] || null;
}

// v2 L126 只有「当前轮 / 上一轮」两个词：roundIndex 最大者显示当前轮，其余显示上一轮。
// 存储保留序号（而不是布尔），这样接受第三次、第四次也不会乱。
function blockRoundLabel(core, blockId) {
  const block = core.blocks[blockId];
  if (!block) return null;
  const maxRoundIndex = Math.max(...Object.values(core.blocks).map((b) => b.roundIndex));
  return block.roundIndex === maxRoundIndex ? "current" : "previous";
}

// 默认位置（规格 §4.3）：卡面内自上而下，固定块宽与间距（v2 三次提到「默认位置」但未定义）。
function defaultPosition(content) {
  const index = content.blockInstances.length;
  return {
    x: 40,
    y: 40 + index * (BLOCK_DEFAULT.h + BLOCK_GAP),
    w: BLOCK_DEFAULT.w,
    h: BLOCK_DEFAULT.h,
  };
}

// 查看仅限他人卡（v2 L68「任意一张其他卡」，「其他」是显式限定）。
// 查看是纯读：不产生任何 action，不写入 draft，因此也不触发"编辑中"。
function canView(core, viewerHolderId, cardId) {
  const card = core.cards[cardId];
  if (!card) return false;
  return card.holderId !== viewerHolderId;
}

// 返回副本：视图层只能读，不能借这份引用改动核心状态。
function visibleContentFor(core, cardId, viewerHolderId) {
  const card = core.cards[cardId];
  if (!card) return null;
  const holderSeesOwnDraft = viewerHolderId === card.holderId && card.draft !== null;
  return clone(holderSeesOwnDraft ? card.draft : card.visible);
}

HANDLERS[ACTIONS.SUBMISSION_ACCEPT] = {
  check(core, action) {
    const req = findRequirement(core, action.reqId);
    if (!req) return "NOT_FOUND";
    if (action.actorId !== req.receiverId) return "NOT_RECEIVER";
    const submission = currentSubmission(core, req);
    if (!submission) return "NOT_PENDING_REPLY";
    if (submission.state === "agreed") return "ALREADY_AGREED";
    if (submission.state !== "pendingReply") return "NOT_PENDING_REPLY";
    return null;
  },
  apply(next, action) {
    const req = findRequirement(next, action.reqId);
    const submission = currentSubmission(next, req);
    submission.state = "agreed";

    // 块是交接级原型；实例是每卡独立的（v2 L110 + L126）。
    const blockId = "b" + next.seq++;
    next.blocks[blockId] = {
      id: blockId,
      reqId: req.id,
      submissionId: submission.id,
      rawSentence: submission.rawSentence,
      level: next.handover.level,
      thing: next.handover.thing,
      attachmentLink: submission.attachmentLink,
      roundIndex: next.seq++,
    };

    for (const holderId of next.handover.holderIds) {
      const card = next.cards[next.holders[holderId].cardId];
      // T4 分发落点规则：编辑中的卡只进本机草稿，其余直接进他人可见版本。
      const inEditing = card.draft !== null;
      const target = inEditing ? card.draft : card.visible;
      const position = defaultPosition(target);
      target.blockInstances.push({
        blockId,
        x: position.x,
        y: position.y,
        w: position.w,
        h: position.h,
        writtenToVisible: !inEditing,
      });
    }
  },
};

// 临时对话随时可以打开。打回次数只决定图标是否高亮。
function chatUnlocked() {
  return true;
}

// 打回次数超过 3 次后，图标高亮并出现提示。不参与能不能打开的判断。
function chatEmphasized(core) {
  return core.handover.rejectCount > 3;
}

// 当前提交是否已共识。已共识是"提交实例"的状态，不是"条"的终态（规格 §7.4 例外 3）。
function isCurrentAgreed(core, req) {
  const submission = currentSubmission(core, req);
  return !!submission && submission.state === "agreed";
}

// 当前提交是否仍可被接收人回应（待回应或已共识；待重写时三个动作都不可用，v2 L116）。
function isRespondable(core, req) {
  const submission = currentSubmission(core, req);
  return !!submission && (submission.state === "pendingReply" || submission.state === "agreed");
}

HANDLERS[ACTIONS.SUBMISSION_REJECT] = {
  check(core, action) {
    const req = findRequirement(core, action.reqId);
    if (!req) return "NOT_FOUND";
    if (action.actorId !== req.receiverId) return "NOT_RECEIVER";
    if (!isRespondable(core, req)) return "NOT_PENDING_REPLY";
    return null;
  },
  apply(next, action) {
    const req = findRequirement(next, action.reqId);
    const submission = currentSubmission(next, req);

    submission.state = "needsRewrite";
    next.handover.rejectCount += 1;

    // 打回可以附带一句文字，也可以不附带；不附时不得留下空记录（v2 L114）。
    const note = String(action.note == null ? "" : action.note).trim();
    if (note) {
      submission.opinions.push({ id: "o" + next.seq++, authorId: action.actorId, kind: "rejectNote", text: note });
    }
  },
};

HANDLERS[ACTIONS.SUBMISSION_COMMENT] = {
  check(core, action) {
    const req = findRequirement(core, action.reqId);
    if (!req) return "NOT_FOUND";
    if (action.actorId !== req.receiverId) return "NOT_RECEIVER";
    if (!isRespondable(core, req)) return "NOT_PENDING_REPLY";
    if (!String(action.text == null ? "" : action.text).trim()) return "EMPTY_SENTENCE";
    return null;
  },
  apply(next, action) {
    const req = findRequirement(next, action.reqId);
    const submission = currentSubmission(next, req);
    // 提意见只追加文字，不改变状态机的位置（v2 L112 / L118）。
    submission.opinions.push({
      id: "o" + next.seq++,
      authorId: action.actorId,
      kind: "comment",
      text: String(action.text).trim(),
    });
  },
};

// —— 画布：草稿机制与自有内容 ——
//
// 结构性约束：所有画布写 action 只写 card.draft。card.visible 只能由
// canvas/upload 与 canvas/exitEdit 两个 action 写入——这是"编辑中不泄漏"的保证。
// 因而不存在任何能改动共识块字符串或删除共识块的入口（I4 靠"没有入口"实现）。

function requireOwnCard(core, actorId, cardId) {
  const card = core.cards[cardId];
  if (!card || card.holderId !== actorId) return "NOT_HOLDER";
  return null;
}

// 首次改动才产生草稿。此后 visible 与 draft 是两份独立数据，不共享引用。
function ensureDraft(card) {
  if (card.draft === null) card.draft = clone(card.visible);
  return card.draft;
}

// 共识块矩形的夹取：先夹尺寸到 [BLOCK_MIN, CARD]，再把坐标夹进卡面（I5）。
function clampRect(rect) {
  const w = Math.min(Math.max(Number(rect.w) || 0, BLOCK_MIN.w), CARD.w);
  const h = Math.min(Math.max(Number(rect.h) || 0, BLOCK_MIN.h), CARD.h);
  const x = Math.min(Math.max(Number(rect.x) || 0, 0), CARD.w - w);
  const y = Math.min(Math.max(Number(rect.y) || 0, 0), CARD.h - h);
  return { x, y, w, h };
}

function clampPoint(x, y) {
  return {
    x: Math.min(Math.max(Number(x) || 0, 0), CARD.w),
    y: Math.min(Math.max(Number(y) || 0, 0), CARD.h),
  };
}

function draftContentOf(card) {
  return card.draft === null ? card.visible : card.draft;
}

// 画布 action 的统一外壳：先校验持卡人（以及可选的额外校验），再确保草稿存在。
function canvasHandler(checkExtra, run) {
  return {
    check(core, action) {
      const problem = requireOwnCard(core, action.actorId, action.cardId);
      if (problem) return problem;
      return checkExtra ? checkExtra(core, action) : null;
    },
    apply(next, action) {
      const card = next.cards[action.cardId];
      run(next, card, ensureDraft(card), action);
    },
  };
}

const hasText = (core, act) => (draftContentOf(core.cards[act.cardId]).texts.some((t) => t.id === act.textId) ? null : "NOT_FOUND");
const hasLink = (core, act) => (draftContentOf(core.cards[act.cardId]).links.some((l) => l.id === act.linkId) ? null : "NOT_FOUND");
const hasBlock = (core, act) => (draftContentOf(core.cards[act.cardId]).blockInstances.some((i) => i.blockId === act.blockId) ? null : "NOT_FOUND");

HANDLERS[ACTIONS.CANVAS_ADD_INK] = canvasHandler(null, (next, card, draft, action) => {
  draft.ink.push({ id: "i" + next.seq++, points: (action.points || []).map((p) => ({ x: p.x, y: p.y })) });
});

// 撤回涂画。三种用法：
//   all: true        → 清空全部涂画
//   strokeId: "i3"   → 删掉指定那一笔
//   都不给           → 删掉最后一笔（最常用的"撤销"）
// 之前只能画不能撤，画歪一笔就没法补救。
const hasInk = (core, act) => (draftContentOf(core.cards[act.cardId]).ink.length > 0 ? null : "NOT_FOUND");

// 跨图层「撤回上一步」：涂画、文字、链接一起算，撤掉**最后放上去的那一个**。
//
// 不需要额外的历史栈：每个元素的 id 都带全局自增序号（i3 / t4 / l5，来自 core.seq），
// 比较序号就知道谁最后加的。这样撤回顺序天然等于操作顺序，也不会因为刷新或换身份丢失
// ——历史栈放内存里反而会在换身份时对不上。
const idSeq = (id) => Number(String(id).replace(/^[A-Za-z]+/, "")) || 0;
const canvasIsEmpty = (core, act) => {
  const c = draftContentOf(core.cards[act.cardId]);
  return c.ink.length + c.texts.length + c.links.length === 0 ? "NOT_FOUND" : null;
};

HANDLERS[ACTIONS.CANVAS_UNDO] = canvasHandler(canvasIsEmpty, (next, card, draft, action) => {
  const candidates = [
    ...draft.ink.map((s) => ({ kind: "ink", id: s.id })),
    ...draft.texts.map((t) => ({ kind: "text", id: t.id })),
    ...draft.links.map((l) => ({ kind: "link", id: l.id })),
  ]
    .map((item) => ({ ...item, seq: idSeq(item.id) }))
    .sort((a, b) => b.seq - a.seq);
  const last = candidates[0];
  if (!last) return;
  if (last.kind === "ink") draft.ink = draft.ink.filter((s) => s.id !== last.id);
  else if (last.kind === "text") draft.texts = draft.texts.filter((t) => t.id !== last.id);
  else draft.links = draft.links.filter((l) => l.id !== last.id);
});

HANDLERS[ACTIONS.CANVAS_REMOVE_INK] = canvasHandler(hasInk, (next, card, draft, action) => {
  if (action.all === true) {
    draft.ink = [];
    return;
  }
  if (action.strokeId) {
    draft.ink = draft.ink.filter((s) => s.id !== action.strokeId);
    return;
  }
  draft.ink.pop();
});

HANDLERS[ACTIONS.CANVAS_ADD_TEXT] = canvasHandler(null, (next, card, draft, action) => {
  const point = clampPoint(action.x, action.y);
  draft.texts.push({ id: "t" + next.seq++, x: point.x, y: point.y, text: String(action.text == null ? "" : action.text) });
});

HANDLERS[ACTIONS.CANVAS_UPDATE_TEXT] = canvasHandler(hasText, (next, card, draft, action) => {
  draft.texts.find((t) => t.id === action.textId).text = String(action.text == null ? "" : action.text);
});

HANDLERS[ACTIONS.CANVAS_REMOVE_TEXT] = canvasHandler(hasText, (next, card, draft, action) => {
  draft.texts = draft.texts.filter((t) => t.id !== action.textId);
});

HANDLERS[ACTIONS.CANVAS_MOVE_TEXT] = canvasHandler(hasText, (next, card, draft, action) => {
  const text = draft.texts.find((t) => t.id === action.textId);
  const point = clampPoint(action.x, action.y);
  text.x = point.x;
  text.y = point.y;
  if (Number.isFinite(action.w)) text.w = Math.max(24, Math.round(action.w));
  if (Number.isFinite(action.h)) text.h = Math.max(18, Math.round(action.h));
});

HANDLERS[ACTIONS.CANVAS_MOVE_OWN_LINK] = canvasHandler(hasLink, (next, card, draft, action) => {
  const link = draft.links.find((l) => l.id === action.linkId);
  const point = clampPoint(action.x, action.y);
  link.x = point.x;
  link.y = point.y;
});

HANDLERS[ACTIONS.CANVAS_ADD_OWN_LINK] = canvasHandler(null, (next, card, draft, action) => {
  const point = clampPoint(action.x, action.y);
  draft.links.push({
    id: "l" + next.seq++,
    x: point.x,
    y: point.y,
    label: String(action.label == null ? "" : action.label),
    targetRef: action.targetRef == null ? null : action.targetRef,
    addedByHolderId: action.actorId, // I7：自有链接标为「持有人附加」
  });
});

HANDLERS[ACTIONS.CANVAS_REMOVE_OWN_LINK] = canvasHandler(hasLink, (next, card, draft, action) => {
  draft.links = draft.links.filter((l) => l.id !== action.linkId);
});

HANDLERS[ACTIONS.CANVAS_MOVE_BLOCK] = canvasHandler(hasBlock, (next, card, draft, action) => {
  const instance = draft.blockInstances.find((i) => i.blockId === action.blockId);
  const rect = clampRect({ x: action.x, y: action.y, w: instance.w, h: instance.h });
  instance.x = rect.x;
  instance.y = rect.y;
});

HANDLERS[ACTIONS.CANVAS_RESIZE_BLOCK] = canvasHandler(hasBlock, (next, card, draft, action) => {
  const instance = draft.blockInstances.find((i) => i.blockId === action.blockId);
  const rect = clampRect({ x: instance.x, y: instance.y, w: action.w, h: action.h });
  instance.x = rect.x;
  instance.y = rect.y;
  instance.w = rect.w;
  instance.h = rect.h;
});

// canvas/upload：用本机画布整体替换他人可见版本（v2 L64）。上传以本机坐标为准，
// 因此编辑期间移动过的块保留移动后的坐标，不回落默认位置。
HANDLERS[ACTIONS.CANVAS_UPLOAD] = {
  check(core, action) {
    const problem = requireOwnCard(core, action.actorId, action.cardId);
    if (problem) return problem;
    if (core.cards[action.cardId].draft === null) return "NO_DRAFT";
    return null;
  },
  apply(next, action) {
    const card = next.cards[action.cardId];
    card.visible = card.draft;
    card.uploadedOnce = true;
    card.draft = null;
    // 编辑期间收到的块随这次上传进入可见版本。
    for (const instance of card.visible.blockInstances) instance.writtenToVisible = true;
  },
};

// canvas/exitEdit：退出编辑且不上传（规格 §4.2 时刻 ②，v2 L60 的 C7）。
// 未上传的自有改动被丢弃；编辑期间新到、可见版本尚无的块按默认位置写入；uploadedOnce 不变。
HANDLERS[ACTIONS.CANVAS_EXIT_EDIT] = {
  check(core, action) {
    return requireOwnCard(core, action.actorId, action.cardId);
  },
  apply(next, action) {
    const card = next.cards[action.cardId];
    // v2 L27：只打开卡、不改画布，状态保持不变 —— 无草稿时是安全的空操作。
    if (card.draft === null) return;

    const arriving = card.draft.blockInstances.filter(
      (instance) => !card.visible.blockInstances.some((existing) => existing.blockId === instance.blockId)
    );
    for (const instance of arriving) {
      const position = defaultPosition(card.visible);
      card.visible.blockInstances.push({
        blockId: instance.blockId,
        x: position.x,
        y: position.y,
        w: position.w,
        h: position.h,
        writtenToVisible: true,
      });
    }

    card.draft = null; // 自有 ink / texts / links 随之整体丢弃；uploadedOnce 保持不变
  },
};

// 「载入演示剧本」用：一键预置到走查「发放之后」那一刻（v2 L140–L142）。
// 纯函数，与手工填写发放表单走的是同一条路径。
function createDemoWorld() {
  return createCore({
    level: "第一关",
    thing: "收集探测器成功的声音",
    initiatorName: "策划",
    participantNames: ["音乐", "程序"],
  });
}

// 临时对话：交接级单例，全体持卡人共用一段（v2 L82 / L152「这段对话」为单数）。
// 内容只留在这段对话中：不写入要求、不写入画布、不加打回次数、不生成总结。
HANDLERS[ACTIONS.CHAT_SEND] = {
  check(core, action) {
    if (!core.holders[action.actorId]) return "NOT_HOLDER";
    if (!String(action.text == null ? "" : action.text).trim()) return "EMPTY_SENTENCE";
    return null;
  },
  apply(next, action) {
    next.handover.chat.messages.push({
      id: "m" + next.seq++,
      fromId: action.actorId,
      text: String(action.text).trim(),
    });
  },
};

globalThis.__HANDOFF_CORE__ = {
  ACTIONS, TEXT, CARD, BLOCK_DEFAULT, BLOCK_MIN, BLOCK_GAP, LAYER_ORDER,
  createCore, createDemoWorld, dispatch, cardStatus, cardOfHolder, holderList, emptyContent, clone,
  requirementOf, requirementStatus, recordFor, suggestionFor, makeSuggestion,
  currentSubmission, blockOf, blockRoundLabel, visibleContentFor, defaultPosition,
  chatUnlocked, chatEmphasized, isCurrentAgreed, isRespondable, canView,
  requireOwnCard, ensureDraft, clampRect, clampPoint,
};
/* === CORE-END === */

  boundaryReadList: "你正在写的句子、接收人、关卡、东西",

const errorText = (code) => ERROR_TEXT[code] || code;

const STATUS_TEXT_KEY = { neverUploaded: "statusNeverUploaded", uploaded: "statusUploaded", editing: "statusEditing" };
const STATE_TEXT_KEY = { pendingReply: "statePendingReply", agreed: "stateAgreed", needsRewrite: "stateNeedsRewrite" };

// 演示用的内置项目对象。打开链接时高亮其中一个；不访问真实磁盘。
const PROJECT_OBJECTS = [
  { label: "第一关_探测器成功音效.wav", ref: "声音/第一关_探测器成功音效.wav" },
  { label: "第一关_探测器.png", ref: "图/第一关_探测器.png" },
  { label: "第一关.unity", ref: "关卡文件/第一关.unity" },
  { label: "修改历史.log", ref: "修改历史/修改历史.log" },
];

function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

const statusText = (status) => TEXT[STATUS_TEXT_KEY[status]];
const stateText = (state) => TEXT[STATE_TEXT_KEY[state]];

// 界面状态：不进核心、不持久化。这是"换布局不用碰核心"的关键——
// 当前以谁的身份在看、选中哪张卡、哪个面板开着，核心层一概不知情。
function createUi(core, currentHolderId) {
  const holders = holderList(core);
  const me = currentHolderId || (holders[0] ? holders[0].id : null);
  const myCard = me ? cardOfHolder(core, me) : null;
  return {
    currentHolderId: me,
    selectedCardId: myCard ? myCard.id : null,
    composingReqId: null,
    composerReceiverId: null,
    tool: "select",
    panel: null,
    projectRef: null,
    notice: "",
  };
}

// 顶栏只放真实应用会有的信息：这次交接是什么、现在是谁在用。
// 身份切换、载入演示剧本、清空演示都是演示脚手架，全部收进 ~ 控制台——
// 摆在顶栏会让人以为真实产品里也有"切换身份"这种东西。
function viewTopbar(core, ui) {
  const me = ui && ui.currentHolderId ? core.holders[ui.currentHolderId] : null;
  return `<header class="topbar">
    <h1>${escapeHtml(VIEW_TEXT.appTitle)}</h1>
    <span class="handover-badge" data-handover>${escapeHtml(core.handover.level)} · ${escapeHtml(core.handover.thing)}</span>
    ${me ? `<span class="whoami" data-whoami>${escapeHtml(VIEW_TEXT.whoamiLabel)}：${escapeHtml(me.name)}</span>` : ""}
  </header>`;
}

function viewConsoleState(core) {
  const requirements = core.requirements.length
    ? core.requirements
        .map(
          (req) =>
            `<li>给 ${escapeHtml(core.holders[req.receiverId].name)}：${escapeHtml(stateText(requirementStatus(core, req.id)) || "—")}</li>`
        )
        .join("")
    : "<li>（还没有任何要求）</li>";

  const cards = holderList(core)
    .map((h) => {
      const card = cardOfHolder(core, h.id);
      return `<li>${escapeHtml(h.name)}：${escapeHtml(statusText(cardStatus(core, card.id)))} · ${card.visible.blockInstances.length} 块</li>`;
    })
    .join("");

  return `<dl class="console-state">
    <dt>${escapeHtml(VIEW_TEXT.rejectCountLabel)}</dt><dd>${core.handover.rejectCount}</dd>
    <dt>要求</dt><dd><ul>${requirements}</ul></dd>
    <dt>交接卡</dt><dd><ul>${cards}</ul></dd>
  </dl>`;
}

// 演示控制台。默认不渲染；由 ~ 键调出。
function viewConsole(core, ui, consoleOpen, config) {

  const settings = config || CONFIG;

  const identity = core
    ? `<section class="console-section">

          .map((h) => {

function viewCards(core, ui) {
  const rows = holderList(core)
    .map((h) => {
      const card = cardOfHolder(core, h.id);
      const status = cardStatus(core, card.id);
      const selected = ui.selectedCardId === card.id ? " is-selected" : "";
      const own = h.id === ui.currentHolderId ? " is-own" : "";
      return `<li class="card-row${selected}${own}" data-action="select-card" data-card-id="${card.id}">
        <span class="card-holder">${escapeHtml(h.name)}</span>

    .join("");

}

// 书写建议以「批注」呈现：一份贴在书写区下面的注记，像文稿边上的批注。
// 之所以做成批注而不是一行提示：模型给的「可能产生的理解」通常有一两百字，
// 塞进输入框上方会变成一堵墙；批注的形式装得下，而且一句「只给你看 · 不进卡」就把边界摆在眼前。
// 单独抽出这个函数，是因为输入原句时要能在不重绘整页的前提下只换这一块（否则会丢输入焦点）。
function viewSuggestion(suggestion, sentence, reqId) {
  if (!suggestion) return `<div class="annotation is-empty" data-suggestion></div>`;
  return `<aside class="annotation" data-suggestion>
    <header class="annotation-head">
      <span class="annotation-tag">${escapeHtml(VIEW_TEXT.annotationTag)}</span>
      <span class="tiny muted">${escapeHtml(VIEW_TEXT.annotationScope)}</span>
    </header>
    ${sentence ? `<blockquote class="annotation-quote">${escapeHtml(sentence)}</blockquote>` : ""}
    <p class="annotation-understanding" data-understanding>${escapeHtml(suggestion.understanding)}</p>
    <p class="annotation-usable">${escapeHtml(VIEW_TEXT.annotationUsableLabel)}：<b data-usable>${escapeHtml(suggestion.usable)}</b></p>
    <footer class="annotation-foot">
      <button type="button" data-action="adopt-suggestion" data-req-id="${escapeHtml(reqId || "")}">${escapeHtml(VIEW_TEXT.adoptButton)}</button>
      <span class="tiny muted">${escapeHtml(VIEW_TEXT.adoptHint)}</span>
    </footer>
    <p class="tiny muted">${escapeHtml(TEXT.suggestionDisclaimer)}</p>
  </aside>`;
}

// 助手边界：每一条「不碰」都配一句"怎么看"，让它当场可验证，而不是一句口号。
const BOUNDARY_NOT = [
  { what: "不改你的原句", how: "只有点「用这句」才会换掉" },
  { what: "不写进交接卡", how: "提交之后，建议就从这里消失" },
  { what: "对方看不到", how: "换到接收人，这边是空的" },
  { what: "不替人点按钮", how: "接受、打回、提意见还是接收人自己点" },

];

function viewBoundary() {
  const not = BOUNDARY_NOT.map(
    (b) => `<li><b>${escapeHtml(b.what)}</b><span class="tiny muted">${escapeHtml(b.how)}</span></li>`
  ).join("");

    <summary>${escapeHtml(VIEW_TEXT.boundaryTitle)}</summary>
    <div class="boundary-grid">
      <section><h4>${escapeHtml(VIEW_TEXT.boundaryReads)}</h4><p>${escapeHtml(VIEW_TEXT.boundaryReadList)}</p></section>
      <section><h4>${escapeHtml(VIEW_TEXT.boundaryWrites)}</h4><p>${escapeHtml(VIEW_TEXT.boundaryWriteList)}</p></section>
      <section><h4>${escapeHtml(VIEW_TEXT.boundaryNot)}</h4><ul class="boundary-not">${not}</ul></section>
    </div>
  </details>`;
}

function viewComposer(core, ui) {
  const receivers = holderList(core)
    .filter((h) => h.id !== core.handover.initiatorId)
    .map((h) => `<option value="${h.id}"${ui.composerReceiverId === h.id ? " selected" : ""}>${escapeHtml(h.name)}</option>`)
    .join("");

  const req = ui.composingReqId ? requirementOf(core, ui.composingReqId) : null;
  const agreed = req ? isCurrentAgreed(core, req) : false;
  const suggestion = req ? suggestionFor(core, req.id, ui.currentHolderId) : null;

  const linkOptions = [`<option value="">${escapeHtml(VIEW_TEXT.attachNone)}</option>`]
    .concat(PROJECT_OBJECTS.map((o) => `<option value="${escapeHtml(o.ref)}">${escapeHtml(o.label)}</option>`))
    .join("");

  return `<div class="composer" data-composer>
    <label class="field"><span>${escapeHtml(VIEW_TEXT.writeTo)}</span>
      <select data-bind="composer-receiver"><option value="">${escapeHtml(VIEW_TEXT.pickReceiver)}</option>${receivers}</select>
    </label>
    <label class="field"><span>${escapeHtml(VIEW_TEXT.sentence)}</span>
      <textarea data-bind="composer-text"${ui.composerReceiverId ? "" : " disabled"}>${escapeHtml(req ? req.draftText : "")}</textarea>
    </label>
    ${viewSuggestion(suggestion, req ? req.draftText : "", req ? req.id : "")}
    <label class="field attach-field"><span>${escapeHtml(VIEW_TEXT.attachLink)}</span>
      <span class="attach-controls">
        <select data-bind="composer-link">${linkOptions}</select>

      </span>

}

function viewSubmission(core, ui, req, sub, isCurrent) {
  const canRespond =
    isCurrent && ui.currentHolderId === req.receiverId && isRespondable(core, req);

  const opinions = sub.opinions
    .map((o) => `<li class="opinion" data-kind="${o.kind}">${escapeHtml(core.holders[o.authorId].name)}：${escapeHtml(o.text)}</li>`)

    ? `<button type="button" class="link" data-action="open-link" data-ref="${escapeHtml(sub.attachmentLink.targetRef)}">${escapeHtml(sub.attachmentLink.label)}</button>`

  const actions = canRespond
    ? `<div class="actions" data-actions>

        </span>
        <span class="inline">
          <textarea data-bind="comment-text" data-req-id="${req.id}" placeholder="${escapeHtml(VIEW_TEXT.commentPlaceholder)}"></textarea>
          <button type="button" data-action="comment" data-req-id="${req.id}">${escapeHtml(VIEW_TEXT.commentButton)}</button>

function viewRequirement(core, ui, req) {
  const submissions = req.submissions
    .map((sub) => viewSubmission(core, ui, req, sub, sub.id === req.currentSubmissionId))
    .join("");
  // 必须让双方都看得出"这是谁和谁的事"。
  // 之前只有「给 音乐」和一句要求，以音乐身份看过去根本不知道是谁发来的。
  const fromName = core.holders[core.handover.initiatorId].name;
  const toName = core.holders[req.receiverId].name;
  const forMe = req.receiverId === ui.currentHolderId;
  return `<article class="requirement" data-requirement="${req.id}">
    <header>
      <span class="pill" data-requirement-route="${escapeHtml(fromName)}→${escapeHtml(toName)}">${escapeHtml(fromName)} → ${escapeHtml(toName)}</span>
      ${forMe ? `<span class="tiny muted" data-requirement-for-me>这件事是给你的</span>` : ""}
      <span class="tiny muted" data-requirement-author>要求由 ${escapeHtml(fromName)} 提出</span>
    </header>
    ${submissions}
